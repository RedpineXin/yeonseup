<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연습 Yeonseup</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연습">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f0e6; --card:#fffdf8; --ink:#1e1b17; --muted:#6f685d; --line:#e2d9c8;
  --seal:#b8432f; --seal-soft:#f3dcd4; --jade:#2f6b57; --jade-soft:#d7e8df; --gold:#a8792a;
  --shadow:0 1px 0 rgba(30,27,23,.04),0 8px 24px -12px rgba(30,27,23,.18);
  --serif:"Gowun Batang",ui-serif,Georgia,serif; --sans:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#171512; --card:#211e1a; --ink:#f0e9dc; --muted:#a59c8d; --line:#3a352d;
  --seal:#e0705b; --seal-soft:#3d2620; --jade:#6fbf9f; --jade-soft:#1f332b; --gold:#d6a752;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -12px rgba(0,0,0,.6);}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
nav{padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .seal{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--seal);letter-spacing:.02em}
.brand .latin{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--jade)} .sync.err i{background:var(--seal)}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
nav .in{max-width:640px;margin:0 auto;display:flex}
nav a{flex:1;text-align:center;padding:10px 0 14px;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:.03em}
nav a b{display:block;font-family:var(--serif);font-size:18px;font-weight:400;color:var(--ink);opacity:.55}
nav a.on{color:var(--seal)} nav a.on b{color:var(--seal);opacity:1}
h1{font-family:var(--serif);font-weight:700;font-size:28px;margin:6px 0 4px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:20px;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-family:var(--serif);font-size:44px;line-height:1.15;font-weight:700;margin:6px 0;word-break:keep-all}
.ko{font-family:var(--serif)}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--seal-soft);color:var(--seal);font-weight:500}
.pill.j{background:var(--jade-soft);color:var(--jade)}
.pill.n{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:500;transition:transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}
.icon{appearance:none;border:1px solid var(--line);background:transparent;border-radius:99px;width:38px;height:38px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon svg{width:18px;height:18px}
input[type=text],textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--ink)}
.answer{font-size:22px;font-family:var(--serif);text-align:center}
.inline-in{display:inline-block;width:auto;min-width:5.5em;font-family:var(--serif);font-size:inherit;padding:2px 8px;margin:0 2px;border-radius:8px;border:1.5px dashed var(--seal);background:var(--seal-soft);text-align:center}
.sent{font-family:var(--serif);font-size:24px;line-height:1.7;word-break:keep-all}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades.three{grid-template-columns:repeat(3,1fr)}
.grades .btn{padding:12px 4px;font-size:14px}
.grades .btn small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.grades .btn.sug{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.verdict{font-weight:600;margin:14px 0 4px}
.verdict.ok{color:var(--jade)} .verdict.no{color:var(--seal)}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 16px}
.progress i{display:block;height:100%;background:var(--seal);transition:width .3s}
.ex{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:12px 0}
.ex .ko{font-size:18px}
.list{list-style:none;padding:0;margin:0}
.list li{padding:12px 2px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.list li:last-child{border-bottom:0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--serif);font-size:26px}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--seal);opacity:.8;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.zero{background:var(--line)}
.notes{white-space:pre-line}
a{color:var(--seal)}
a.btn{color:inherit;text-decoration:none}
a.btn.primary{color:var(--paper)}
.hide{display:none!important}
.fb{background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}
.dots{display:inline-block;animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal .card{max-width:420px;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="seal">연습</span><span class="latin">Yeonseup</span></div>
    <div class="sync" id="sync"><i></i><span>on this device</span></div>
  </header>
  <main id="view"></main>
</div>
<nav><div class="in">

</div></nav>

{id:"girohada",form:"-기로 하다",meaning:"decide to; agree/plan to",

  {q:"무거우면 제가 ___ 줄게요.",h:"돕다",a:["도와"],en:"If it's heavy, I'll help you."}]},
{id:"jimalda",form:"-지 말다",meaning:"don't (negative command / suggestion)",
 notes:"Stem + 지 마세요 (please don't), 지 마 (casual), 지 맙시다 / 지 말자 (let's not). Only for commands and suggestions — for statements use 안 or -지 않다.",
 ex:[["너무 걱정하지 마세요.","Don't worry too much."]],
 drills:[
  {q:"여기서 사진을 ___.",h:"찍다 → please don't",a:["찍지 마세요","찍지 마십시오"],en:"Please don't take photos here."},
  {q:"너무 ___.",h:"걱정하다 → please don't",a:["걱정하지 마세요"],en:"Don't worry too much."},
  {q:"내일은 늦게 ___.",h:"오다 → please don't",a:["오지 마세요"],en:"Please don't come late tomorrow."},
  {q:"우리 오늘은 술 ___.",h:"마시다 → let's not",a:["마시지 맙시다","마시지 말자","마시지 말아요"],en:"Let's not drink today."}]},
{id:"modifiers",form:"-(으)ㄴ / -는 / -(으)ㄹ + noun",meaning:"modifiers: the movie (that) I saw / am watching / will watch",
 notes:"Action verbs: past -(으)ㄴ (본 영화), present -는 (보는 영화), future -(으)ㄹ (볼 영화). Adjectives: -(으)ㄴ (큰 집, 좋은 사람). 있다/없다 take -는 (재미있는 책). ㄹ-stem drops ㄹ before ㄴ: 살다 → 사는, 산.",
 ex:[["어제 본 영화가 재미있었어요.","The movie I saw yesterday was fun."],["지금 듣는 노래가 뭐예요?","What's the song you're listening to now?"]],
 drills:[
  {q:"어제 ___ 영화가 재미있었어요.",h:"보다, past",a:["본"],en:"The movie I saw yesterday was fun."},
  {q:"지금 ___ 노래가 뭐예요?",h:"듣다, present",a:["듣는"],en:"What's the song you're listening to now?"},
  {q:"내일 ___ 옷을 골랐어요.",h:"입다, future",a:["입을"],en:"I picked out the clothes I'll wear tomorrow."},
  {q:"저기 키가 ___ 사람이 누구예요?",h:"크다",a:["큰"],en:"Who's that tall person over there?"}]},
{id:"honorific",form:"-(으)시- (honorific)",meaning:"showing respect to the subject (elders, superiors)",
 notes:"Vowel stem + 시, consonant stem + 으시: 가세요, 읽으세요; past 가셨어요. ㄹ-stem drops ㄹ: 살다 → 사세요. Special verbs: 먹다/마시다 → 드시다, 자다 → 주무시다, 있다 → 계시다, 말하다 → 말씀하시다. Subject particle 께서.",
 ex:[["할머니께서 신문을 읽으세요.","Grandma is reading the newspaper."]],
 drills:[
  {q:"할머니께서 신문을 ___.",h:"읽다, honorific",a:["읽으세요","읽으십니다"],en:"Grandma is reading the newspaper."},
  {q:"선생님은 어디에 ___?",h:"살다, honorific",a:["사세요","사십니까"],en:"Where do you live, teacher?"},
  {q:"아버지께서 어제 ___.",h:"오다, honorific past",a:["오셨어요","오셨습니다"],en:"My father came yesterday."},
  {q:"할아버지께서 지금 ___ 계세요.",h:"자다 (special honorific verb)",a:["주무시고"],en:"Grandpa is sleeping right now."}]},
{id:"neyo",form:"-네요",meaning:"oh, … (surprise / noticing something now)",
 notes:"Stem + 네요: 좋네요, 잘하네요; noun N(이)네요. ㄹ-stem drops ㄹ: 멀다 → 머네요. Reacts to something you just noticed.",
 ex:[["와, 한국어를 정말 잘하시네요!","Wow, you speak Korean really well!"]],
 drills:[
  {q:"오늘 날씨가 정말 ___.",h:"좋다",a:["좋네요"],en:"Oh, the weather's really nice today."},
  {q:"와, 한국어를 정말 잘 ___!",h:"하다",a:["하네요","하시네요"],en:"Wow, you speak Korean really well!"},
  {q:"벌써 ___.",h:"12시이다",a:["12시네요","12시이네요","열두시네요"],en:"Oh, it's already 12."},
  {q:"오늘은 길이 많이 ___.",h:"막히다",a:["막히네요"],en:"Wow, traffic is really bad today."}]},
{id:"jiyo",form:"-지요 (-죠)",meaning:"…, right? (seeking agreement / softly stating)",
 notes:"Stem + 지요, usually shortened to 죠: 있죠?, 맛있죠? Noun: N(이)죠. Also used for a soft statement: 그렇죠.",
 ex:[["이거 정말 맛있죠?","This is really good, isn't it?"]],
 drills:[
  {q:"내일 회의 ___?",h:"있다",a:["있죠","있지요"],en:"There's a meeting tomorrow, right?"},
  {q:"민수 씨는 한국 ___?",h:"사람이다",a:["사람이죠","사람이지요"],en:"Minsu is Korean, right?"},
  {q:"이거 정말 ___?",h:"맛있다",a:["맛있죠","맛있지요"],en:"This is really good, isn't it?"},
  {q:"오늘 날씨가 많이 ___?",h:"춥다",a:["춥죠","춥지요"],en:"It's really cold today, isn't it?"}]},
{id:"compare",form:"보다 / 처럼 / 만큼",meaning:"than / like / as … as",
 notes:"N보다 (더) = more than N: 형보다 커요. N처럼 = like N (manner/similarity): 아이처럼 웃어요. N만큼 = as much as N: 저만큼 커요.",
 ex:[["오늘은 어제보다 더 추워요.","Today is colder than yesterday."]],
 drills:[
  {q:"제가 형___ 키가 더 커요.",h:"보다 / 처럼 / 만큼",a:["보다"],en:"I'm taller than my older brother."},
  {q:"그 사람은 아이___ 웃어요.",h:"보다 / 처럼 / 만큼",a:["처럼"],en:"That person laughs like a child."},
  {q:"동생도 저___ 키가 커요.",h:"보다 / 처럼 / 만큼",a:["만큼"],en:"My younger sibling is as tall as me."},
  {q:"오늘은 어제___ 더 추워요.",h:"보다 / 처럼 / 만큼",a:["보다"],en:"Today is colder than yesterday."}]},
{id:"doman",form:"도 / 만 / 밖에",meaning:"also / only / nothing but (밖에 + negative)",
 notes:"도 = also, too. 만 = only (neutral). 밖에 = only, with a negative verb and a sense of \"not enough\": 천 원밖에 없어요.",
 ex:[["시간이 10분밖에 안 남았어요.","There are only 10 minutes left."]],
 drills:[
  {q:"저는 커피___ 마셔요. 차는 안 마셔요.",h:"도 / 만 / 밖에",a:["만"],en:"I only drink coffee. I don't drink tea."},
  {q:"지갑에 돈이 천 원___ 없어요.",h:"도 / 만 / 밖에",a:["밖에"],en:"I only have 1,000 won in my wallet."},
  {q:"저___ 가고 싶어요.",h:"도 / 만 / 밖에",a:["도"],en:"I want to go too."},
  {q:"시간이 10분___ 안 남았어요.",h:"도 / 만 / 밖에",a:["밖에"],en:"There are only 10 minutes left."}]},
{id:"gonaseo",form:"-고 나서",meaning:"after finishing (doing)",
 notes:"Action stem + 고 나서: 먹고 나서, 하고 나서. Stresses that the first action is completed before the next. Close to -(으)ㄴ 후에.",
 ex:[["밥을 먹고 나서 이를 닦아요.","I brush my teeth after eating."]],
 drills:[
  {q:"숙제를 ___ 놀아요.",h:"하다 + after finishing",a:["하고 나서","하고 나서야"],en:"I play after finishing my homework."},
  {q:"밥을 ___ 이를 닦아요.",h:"먹다 + after finishing",a:["먹고 나서"],en:"I brush my teeth after eating."},
  {q:"영화를 ___ 저녁을 먹었어요.",h:"보다 + after finishing",a:["보고 나서"],en:"We had dinner after watching the movie."},
  {q:"이 책을 다 ___ 빌려줄게요.",h:"읽다 + after finishing",a:["읽고 나서"],en:"I'll lend you this book after I finish it."}]},
{id:"jamaja",form:"-자마자",meaning:"as soon as",
 notes:"Action stem + 자마자, no tense on it: 도착하자마자, 듣자마자.",
 ex:[["집에 도착하자마자 잤어요.","I went to sleep as soon as I got home."]],
 drills:[
  {q:"집에 ___ 잤어요.",h:"도착하다",a:["도착하자마자"],en:"I fell asleep as soon as I got home."},
  {q:"수업이 ___ 밖으로 나갔어요.",h:"끝나다",a:["끝나자마자"],en:"I went outside as soon as class ended."},
  {q:"그 소식을 ___ 전화했어요.",h:"듣다",a:["듣자마자"],en:"I called as soon as I heard the news."},
  {q:"아침에 ___ 커피를 마셔요.",h:"일어나다",a:["일어나자마자"],en:"I drink coffee as soon as I get up."}]},
{id:"myeonseo",form:"-(으)면서",meaning:"while (doing two things at once)",
 notes:"Vowel/ㄹ stem + 면서 (마시면서, 살면서); consonant stem + 으면서 (먹으면서). ㄷ-irregular: 듣다 → 들으면서, 걷다 → 걸으면서. Same subject.",
 ex:[["음악을 들으면서 공부해요.","I study while listening to music."]],
 drills:[
  {q:"음악을 ___ 공부해요.",h:"듣다",a:["들으면서"],en:"I study while listening to music."},
  {q:"밥을 ___ 텔레비전을 봐요.",h:"먹다",a:["먹으면서"],en:"I watch TV while eating."},
  {q:"공원을 ___ 이야기했어요.",h:"걷다",a:["걸으면서"],en:"We talked while walking in the park."},
  {q:"커피를 ___ 일해요.",h:"마시다",a:["마시면서"],en:"I work while drinking coffee."}]},
{id:"eunji",form:"-(으)ㄴ 지 (시간이) 되다",meaning:"it's been (time) since …",
 notes:"Past modifier -(으)ㄴ + 지 + time + 되다/넘다: 배운 지 2년 됐어요. ㄹ-stem: 살다 → 산 지.",
 ex:[["한국어를 배운 지 2년 됐어요.","It's been two years since I started learning Korean."]],
 drills:[
  {q:"한국어를 ___ 2년 됐어요.",h:"배우다",a:["배운 지"],en:"It's been two years since I started learning Korean."},
  {q:"서울에 ___ 얼마나 됐어요?",h:"오다",a:["온 지"],en:"How long has it been since you came to Seoul?"},
  {q:"베를린에 ___ 3년이 넘었어요.",h:"살다",a:["산 지"],en:"I've been living in Berlin for over three years."},
  {q:"밥을 ___ 한 시간밖에 안 됐어요.",h:"먹다",a:["먹은 지"],en:"It's only been an hour since I ate."}]},
{id:"gisijak",form:"-기 시작하다",meaning:"start doing",
 notes:"Stem + 기 시작하다: 오기 시작했어요, 배우기 시작했어요.",
 ex:[["갑자기 비가 오기 시작했어요.","It suddenly started raining."]],
 drills:[
  {q:"갑자기 비가 ___ 시작했어요.",h:"오다",a:["오기"],en:"It suddenly started raining."},
  {q:"작년부터 중국어를 ___ 시작했어요.",h:"배우다",a:["배우기"],en:"I started learning Chinese last year."},
  {q:"아이가 갑자기 ___ 시작했어요.",h:"울다",a:["울기"],en:"The child suddenly started crying."},
  {q:"다음 주부터 새 회사에서 ___ 시작해요.",h:"일하다",a:["일하기"],en:"I start working at a new company next week."}]},
{id:"aitda",form:"-아/어 있다",meaning:"be in a state (result of an action remains)",
 notes:"Intransitive/passive stem + 아/어 있다: 열려 있다 (be open), 앉아 있다 (be seated), 걸려 있다 (be hanging). Compare -고 있다 (the action in progress): 앉고 있어요 = in the middle of sitting down.",
 ex:[["문이 열려 있어요.","The door is open."]],
 drills:[
  {q:"문이 ___ 있어요.",h:"열리다",a:["열려"],en:"The door is open."},
  {q:"민수 씨는 의자에 ___ 있어요.",h:"앉다",a:["앉아"],en:"Minsu is sitting on the chair."},
  {q:"벽에 그림이 ___ 있어요.",h:"걸리다",a:["걸려"],en:"There's a picture hanging on the wall."},
  {q:"공원에 꽃이 많이 ___ 있어요.",h:"피다",a:["피어"],en:"Lots of flowers are in bloom in the park."}]},
{id:"ryeogohada",form:"-(으)려고 하다",meaning:"plan to, intend to; be about to",
 notes:"Vowel/ㄹ stem + 려고 하다 (가려고 해요, 만들려고 해요); consonant stem + 으려고 하다 (읽으려고 해요). Past -(으)려고 했어요 = \"I was going to (but…)\".",
 ex:[["내일부터 운동을 시작하려고 해요.","I'm planning to start working out tomorrow."]],
 drills:[
  {q:"내일부터 운동을 ___ 해요.",h:"시작하다",a:["시작하려고"],en:"I'm planning to start working out from tomorrow."},
  {q:"지금 막 ___ 했어요.",h:"나가다",a:["나가려고"],en:"I was just about to leave."},
  {q:"올해는 책을 많이 ___ 해요.",h:"읽다",a:["읽으려고"],en:"This year I plan to read a lot of books."},
  {q:"주말에 김치를 ___ 해요.",h:"만들다",a:["만들려고"],en:"I'm planning to make kimchi this weekend."}]},
{id:"eullaeyo",form:"-(으)ㄹ래요",meaning:"I'll have / I want to; do you want to …? (casual-polite)",
 notes:"Vowel/ㄹ stem + ㄹ래요 (갈래요, 만들래요); consonant stem + 을래요 (먹을래요). Statement = my choice; question = asking the listener's wish. Not for superiors in formal settings.",
 ex:[["저는 커피 마실래요.","I'll have coffee."],["같이 갈래요?","Do you want to go together?"]],
 drills:[
  {q:"저는 커피 ___.",h:"마시다",a:["마실래요"],en:"I'll have coffee."},
  {q:"점심에 뭐 ___?",h:"먹다",a:["먹을래요"],en:"What do you want to eat for lunch?"},
  {q:"주말에 같이 ___?",h:"가다",a:["갈래요"],en:"Want to go together this weekend?"},
  {q:"오늘은 그냥 집에 ___.",h:"있다",a:["있을래요"],en:"I'll just stay home today."}]},
{id:"jianhado",form:"-지 않아도 되다",meaning:"don't have to",
 notes:"Stem + 지 않아도 되다, or the shorter 안 + -아/어도 되다: 가지 않아도 돼요 = 안 가도 돼요.",
 ex:[["내일은 회사에 가지 않아도 돼요.","I don't have to go to the office tomorrow."]],
 drills:[
  {q:"내일은 회사에 ___ 돼요.",h:"가다 → don't have to",a:["가지 않아도","안 가도"],en:"I don't have to go to the office tomorrow."},
  {q:"오늘은 돈을 ___ 돼요.",h:"내다 → don't have to",a:["내지 않아도","안 내도"],en:"You don't have to pay today."},
  {q:"너무 ___ 돼요.",h:"걱정하다 → don't have to",a:["걱정하지 않아도","걱정 안 해도","안 걱정해도"],en:"You don't need to worry so much."},
  {q:"예약은 ___ 돼요.",h:"하다 → don't have to",a:["하지 않아도","안 해도"],en:"You don't need to make a reservation."}]},
{id:"euljulalda",form:"-(으)ㄹ 줄 알다/모르다",meaning:"know how to / not know how to",
 notes:"Vowel/ㄹ stem + ㄹ 줄 알다 (할 줄 알아요); consonant stem + 을 줄 (읽을 줄). About skills you've learned (swimming, driving, cooking).",
 ex:[["운전할 줄 알아요?","Do you know how to drive?"]],
 drills:[
  {q:"저는 수영을 ___ 몰라요.",h:"하다",a:["할 줄"],en:"I don't know how to swim."},
  {q:"운전을 ___ 알아요?",h:"하다",a:["할 줄"],en:"Do you know how to drive?"},
  {q:"엄마는 김치를 ___ 아세요.",h:"담그다",a:["담글 줄"],en:"My mom knows how to make kimchi."},
  {q:"피아노를 ___ 몰라요.",h:"치다",a:["칠 줄"],en:"I don't know how to play the piano."}]},
{id:"aboida",form:"-아/어 보이다",meaning:"look, seem (based on appearance)",
 notes:"Adjective stem + 아/어 보이다: 피곤해 보여요, 맛있어 보여요, 슬퍼 보여요. For nouns: N처럼 보이다.",
 ex:[["오늘 좀 피곤해 보여요.","You look a bit tired today."]],
 drills:[
  {q:"오늘 좀 ___.",h:"피곤하다 → look (polite present)",a:["피곤해 보여요"],en:"You look a bit tired today."},
  {q:"이 케이크 정말 ___.",h:"맛있다 → look",a:["맛있어 보여요"],en:"This cake looks really delicious."},
  {q:"그 옷을 입으니까 ___.",h:"젊다 → look",a:["젊어 보여요"],en:"You look young in those clothes."},
  {q:"민수 씨 표정이 좀 ___.",h:"슬프다 → look",a:["슬퍼 보여요"],en:"Minsu looks a bit sad."}]},
{id:"get",form:"-겠-",meaning:"must be, I bet (reaction / supposition)",
 notes:"Stem + 겠어요: 맛있겠어요 (that must be tasty), 피곤하겠어요 (you must be tired). Also formal intention (제가 하겠습니다) and fixed politeness (알겠습니다, 처음 뵙겠습니다).",
 ex:[["와, 맛있겠어요!","Wow, that looks delicious!"]],
 drills:[
  {q:"와, 이 케이크 ___!",h:"맛있다",a:["맛있겠어요","맛있겠다"],en:"Wow, this cake must be delicious!"},
  {q:"오늘 열 시간 일했어요? 정말 ___.",h:"피곤하다",a:["피곤하겠어요","피곤하시겠어요"],en:"You worked ten hours today? You must be exhausted."},
  {q:"내일은 눈이 와서 ___.",h:"춥다",a:["춥겠어요"],en:"It's going to snow tomorrow, so it'll be cold."},
  {q:"이사도 하고 시험도 있으면 정말 ___.",h:"바쁘다",a:["바쁘겠어요","바쁘시겠어요"],en:"Moving and exams at the same time — you must be really busy."}]},
{id:"ado2",form:"-아/어도",meaning:"even if, even though",
 notes:"Stem + 아/어도: 와도, 바빠도, 비싸도. With 아무리 = \"no matter how\": 아무리 운동해도.",
 ex:[["아무리 바빠도 밥은 꼭 먹어요.","No matter how busy I am, I always eat."]],
 drills:[
  {q:"내일 비가 ___ 갈 거예요.",h:"오다",a:["와도"],en:"Even if it rains tomorrow, I'll go."},
  {q:"아무리 ___ 살이 안 빠져요.",h:"운동하다",a:["운동해도"],en:"No matter how much I exercise, I don't lose weight."},
  {q:"아무리 ___ 밥은 꼭 먹어요.",h:"바쁘다",a:["바빠도"],en:"No matter how busy I am, I always eat."},
  {q:"좀 ___ 이 가방을 사고 싶어요.",h:"비싸다",a:["비싸도"],en:"Even if it's a bit pricey, I want to buy this bag."}]},
{id:"nominal",form:"-는 것 / -기 (verb → noun)",meaning:"doing X (turning a verb into a noun)",
 notes:"-는 것 (often -는 거, -는 게 = 것이, -는 걸 = 것을) is the general way: 요리하는 걸 좋아해요. -기 is common with 좋다/싫다/쉽다/어렵다 and in set phrases: 배우기 어려워요, 취미는 사진 찍기.",
 ex:[["저는 요리하는 걸 좋아해요.","I like cooking."]],
 drills:[
  {q:"한국어를 ___ 재미있어요.",h:"배우다 + subject",a:["배우는 게","배우는 것이","배우는 거","배우기가"],en:"Learning Korean is fun."},
  {q:"저는 ___ 좋아해요.",h:"요리하다 + object",a:["요리하는 걸","요리하는 것을","요리하기를","요리하는 거"],en:"I like cooking."},
  {q:"매일 ___ 쉽지 않아요.",h:"운동하다 + subject",a:["운동하는 게","운동하는 것이","운동하기가","운동하는 거"],en:"Working out every day isn't easy."},
  {q:"혼자 밥 ___ 싫어요.",h:"먹다 + subject",a:["먹는 게","먹는 것이","먹는 거","먹기"],en:"I don't like eating alone."}]},

{id:"nyago",form:"-냐고 하다 / 묻다 (reported questions)",meaning:"(someone) asked whether / what …",

{id:"rago",form:"-(으)라고 하다 (reported commands)",meaning:"(someone) told me to …",

{id:"jago",form:"-자고 하다 (reported suggestions)",meaning:"(someone) suggested that we …",

function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function endOfToday(){const d=new Date();d.setHours(23,59,59,999);return d.getTime();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1800);}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

// ---------- state ----------
const LS_KEY="yeonseup.v1";
function defaultState(){return{v:1,settings:{newVocab:10,newGrammar:1,production:true},cards:{},seenG:{},custom:[],log:{},mistakes:[],writes:[],updatedAt:0};}
function hydrate(x){const d=defaultState();if(!x||typeof x!=="object")return d;const o=Object.assign(d,x);o.settings=Object.assign(defaultState().settings,x.settings||{});return o;}
let S=defaultState();
try{const r=localStorage.getItem(LS_KEY);if(r)S=hydrate(JSON.parse(r));}catch(e){}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}scheduleRemote();}
function logToday(){const k=dayKey();return S.log[k]||(S.log[k]={rev:0,ok:0,newV:0,newG:0});}
function allVocab(){return VOCAB.concat(S.custom||[]);}
function vocabByKo(ko){return allVocab().find(w=>w[0]===ko);}
const G=Object.fromEntries(GRAMMAR.map(g=>[g.id,g]));

// ---------- standalone: no cloud sync ----------
const REMOTE=null;
function scheduleRemote(){}
function setSync(cls,txt){const el=$("#sync");el.className="sync "+cls;el.querySelector("span").textContent=txt;}
function updateOnline(){navigator.onLine?setSync("ok","online"):setSync("","offline");}
window.addEventListener("online",updateOnline);window.addEventListener("offline",updateOnline);updateOnline();

// ---------- audio: the phone's built-in Korean voice ----------
let KO_VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();KO_VOICE=vs.find(v=>/^ko/i.test(v.lang)&&/premium|enhanced|yuna|google/i.test(v.name))||vs.find(v=>/^ko/i.test(v.lang))||null;}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";if(KO_VOICE)u.voice=KO_VOICE;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const canSpeak=()=>("speechSynthesis" in window);
function spkBtn(text){return canSpeak()?`<button class="icon" data-say="${esc(text)}" aria-label="Listen">${SPK}</button>`:"";}

// ---------- Claude feedback via your own API key (stored only on this device) ----------
const KEY_LS="yeonseup.apikey";
function apiKey(){try{return localStorage.getItem(KEY_LS)||"";}catch(e){return"";}}
let SAMPLE=apiKey()?true:null;
async function ask(prompt){
  const key=apiKey();if(!key)throw{code:"not_granted"};
  if(!navigator.onLine)throw{code:"offline"};
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
  if(res.status===401)throw{code:"bad_key"};
  if(res.status===429)throw{code:"rate_limited"};
  if(!res.ok)throw{code:"http",message:res.status};
  const j=await res.json();
  const t=(j.content||[]).map(c=>c.text||"").join("");
  const m=t.match(/\{[\s\S]*\}/);
  if(!m)throw{code:"parse",message:t};
  return JSON.parse(m[0]);
}
function errText(e){return e&&e.code==="offline"?"You're offline — Claude feedback needs internet.":e&&e.code==="bad_key"?"Your API key was rejected. Check it under Progress → Claude feedback.":e&&e.code==="rate_limited"?"Too many requests — try again in a minute.":"Couldn't reach Claude right now.";}

// ---------- spaced repetition ----------
// g: 0 again, 1 hard, 2 good, 3 easy
function schedule(id,g){
  const now=Date.now();
  const c=S.cards[id]||{ivl:0,ease:2.5,reps:0,lapses:0,due:now};
  if(g===0){if(c.reps>0)c.lapses++;c.reps=0;c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.due=now+5*60e3;}
  else{
    let ivl;
    if(c.reps===0)ivl=g===3?4:1;
    else if(c.reps===1)ivl=g===1?2:g===2?3:6;
    else ivl=g===1?c.ivl*1.2:g===2?c.ivl*c.ease:c.ivl*c.ease*1.3;
    if(g===1)c.ease=Math.max(1.3,c.ease-.15);
    if(g===3)c.ease=Math.min(3.2,c.ease+.15);
    c.ivl=Math.max(1,Math.round(ivl));c.reps++;
    c.due=startOfDay(now)+c.ivl*DAY+4*3600e3;
  }
  S.cards[id]=c;
  return c;
}
function preview(id,g){const keep=S.cards[id]?{...S.cards[id]}:null;const c=schedule(id,g);const out=g===0?"5m":c.ivl+"d";if(keep)S.cards[id]=keep;else delete S.cards[id];return out;}
function dueIds(prefix){const end=endOfToday();return Object.keys(S.cards).filter(id=>id.startsWith(prefix)&&S.cards[id].due<=end).sort((a,b)=>S.cards[a].due-S.cards[b].due);}
function newVocabAvailable(){
  const L=logToday();let quota=Math.max(0,S.settings.newVocab-L.newV);const out=[];
  for(const w of allVocab()){if(quota<=0)break;if(!S.cards["v|"+w[0]+"|r"]){out.push("v|"+w[0]+"|r");quota--;}}
  return out;
}
function nextGrammarPoint(){return GRAMMAR.find(g=>!S.seenG[g.id]);}
function grammarNewQuota(){return Math.max(0,S.settings.newGrammar-logToday().newG);}

// ---------- sessions ----------
let SESSION=null;
function startVocab(){
  const due=dueIds("v|").filter(id=>S.settings.production||id.endsWith("|r"));
  const fresh=newVocabAvailable();
  const q=[];let fi=0;
  due.forEach((id,i)=>{q.push({id});if(i%3===2&&fi<fresh.length)q.push({id:fresh[fi++],isNew:true});});
  while(fi<fresh.length)q.push({id:fresh[fi++],isNew:true});
  if(!q.length){toast("Nothing due — come back later");return;}
  SESSION={kind:"vocab",queue:q,done:0,total:q.length,ok:0,wrong:[]};nextItem();
}
function startGrammar(forceId){
  const q=shuffle(dueIds("g|")).map(id=>({id}));
  const add=forceId?G[forceId]:(grammarNewQuota()>0?nextGrammarPoint():null);
  if(add&&!S.seenG[add.id]){
    const drills=add.drills.map((_,i)=>({id:"g|"+add.id+"|"+i,isNew:true}));
    q.unshift({lesson:add.id},...drills);
  }else if(forceId){q.unshift({lesson:forceId,review:true});}
  if(!q.length){toast("Nothing due — learn a new point from the Grammar tab");return;}
  SESSION={kind:"grammar",queue:q,done:0,total:q.filter(x=>!x.lesson).length,ok:0,wrong:[],forced:!!forceId};nextItem();
}
function nextItem(){
  if(!SESSION)return;
  const it=SESSION.queue.shift();
  if(!it){finish();return;}
  SESSION.cur=it;
  if(it.lesson)return renderLesson(it.lesson,true,it.review);
  const [kind,key,sub]=it.id.split("|");
  if(kind==="v")return sub==="r"?renderRecog(it,key):renderProd(it,key);
  return renderCloze(it,key,+sub);
}
function answer(g,given,expected){
  const it=SESSION.cur,L=logToday();
  if(it.isNew&&!it.counted){it.counted=true;if(it.id.startsWith("v|"))L.newV++;}
  L.rev++;if(g>0){L.ok++;SESSION.ok++;}
  schedule(it.id,g);
  if(g===0){
    SESSION.wrong.push(it.id);
    S.mistakes.push({t:Date.now(),id:it.id,given:given||"",expected:expected||""});
    if(S.mistakes.length>150)S.mistakes=S.mistakes.slice(-150);
    const pos=Math.min(SESSION.queue.length,3+Math.floor(Math.random()*3));
    SESSION.queue.splice(pos,0,{id:it.id,counted:true,retry:true});
  }else{
    if(!it.retry)SESSION.done++;
    // unlock production card once a word is recognised
    if(it.id.endsWith("|r")&&S.settings.production){const p=it.id.slice(0,-1)+"p";if(!S.cards[p])S.cards[p]={ivl:0,ease:2.5,reps:0,lapses:0,due:startOfDay(Date.now())+DAY+4*3600e3};}
  }
  if(g===0&&!it.retry)SESSION.done++;
  save();nextItem();
}
function finish(){
  const s=SESSION;SESSION=null;
  const wrongUniq=[...new Set(s.wrong)];
  view().innerHTML=`<h1>수고했어요!</h1><p class="sub">Session done.</p>
  <div class="stat"><div><b>${s.total}</b><span>items</span></div><div><b>${wrongUniq.length}</b><span>missed</span></div><div><b>${streak()}</b><span>day streak</span></div></div>
  ${wrongUniq.length?`<h2>Worth another look</h2><div class="card"><ul class="list">${wrongUniq.map(id=>`<li><span>${labelFor(id)}</span></li>`).join("")}</ul></div>`:""}
  <div class="row" style="margin-top:18px"><a class="btn primary" href="#today">Back to today</a></div>`;
  window.scrollTo(0,0);
}
function labelFor(id){
  const [k,key,sub]=id.split("|");
  if(k==="v"){const w=vocabByKo(key);return `<span class="ko">${esc(key)}</span> <span class="muted">— ${esc(w?w[1]:"")}</span>`;}
  const g=G[key];if(!g)return esc(id);const d=g.drills[+sub];
  return `<span class="ko">${esc(d.q.replace("___",d.a[0]))}</span> <span class="pill n">${esc(g.form)}</span>`;
}
function progressBar(){if(!SESSION)return"";const p=SESSION.total?Math.min(100,SESSION.done/SESSION.total*100):0;
  return `<div class="spread small muted"><span>${SESSION.kind==="vocab"?"Vocabulary":"Grammar"} · ${Math.min(SESSION.done,SESSION.total)}/${SESSION.total}</span><a href="#today" class="muted" data-quit>End</a></div><div class="progress"><i style="width:${p}%"></i></div>`;}
function gradeButtons(id,correct){
  const labels=[["Again",0],["Hard",1],["Good",2],["Easy",3]];
  const set=correct===false?[labels[0],labels[2]]:correct===true?labels.slice(1):labels;
  const sug=correct===false?0:2;
  return `<div class="grades ${set.length===3?"three":""}" ${set.length===2?'style="grid-template-columns:1fr 1fr"':""}>${set.map(([l,g])=>`<button class="btn ${g===sug?"sug":""}" data-g="${g}">${correct===false&&g===2?"I was right":l}<small>${preview(id,g)}</small></button>`).join("")}</div>`;
}

// ---------- item renderers ----------
function renderRecog(it,ko){
  const w=vocabByKo(ko);if(!w){nextItem();return;}
  view().innerHTML=progressBar()+`<div class="card" style="text-align:center;padding:30px 18px">
    ${it.isNew?'<span class="pill">new word</span>':'<span class="pill n">Korean → English</span>'}
    <div class="big">${esc(w[0])}</div><div>${spkBtn(w[0])}</div>
    <div id="rev" class="hide"><p style="font-size:20px;margin:14px 0 6px">${esc(w[1])}</p>
      ${w[2]?`<div class="ex" style="text-align:left"><div class="ko">${esc(w[2])} ${spkBtn(w[2])}</div><div class="muted small">${esc(w[3]||"")}</div></div>`:""}</div>
  </div>
  <div id="act"><button class="btn primary block" id="show">Show meaning <span class="muted small">(space)</span></button></div>`;
  $("#show").onclick=()=>{$("#rev").classList.remove("hide");$("#act").innerHTML=gradeButtons(it.id,null);if(it.isNew)speak(w[0]);};
}
function renderProd(it,ko){
  const w=vocabByKo(ko);if(!w){nextItem();return;}
  view().innerHTML=progressBar()+`<div class="card">
    <span class="pill n">English → Korean</span>
    <p style="font-size:24px;margin:14px 0 4px;font-weight:500">${esc(w[1])}</p>
    ${w[3]?`<p class="muted small">e.g. “${esc(w[3])}”</p>`:""}
    <form id="f"><input type="text" id="in" class="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="한국어로…" lang="ko"></form>
    <div id="res"></div></div><div id="act"><button class="btn primary block" id="chk">Check</button><button class="btn ghost block" id="idk" style="margin-top:8px">I don't know</button></div>`;
  const check=(given)=>{
    const ok=given!==null&&norm(given)===norm(w[0]);
    $("#in").disabled=true;
    $("#res").innerHTML=`<div class="verdict ${ok?"ok":"no"}">${ok?"맞아요 — correct":"Answer"}</div>
      <div class="spread"><span class="ko" style="font-size:28px">${esc(w[0])}</span>${spkBtn(w[0])}</div>
      ${!ok&&given?`<div class="muted small">You wrote: <span class="ko">${esc(given)}</span></div>`:""}
      ${w[2]?`<div class="ex"><div class="ko">${esc(w[2])} ${spkBtn(w[2])}</div><div class="muted small">${esc(w[3]||"")}</div></div>`:""}`;
    $("#act").innerHTML=gradeButtons(it.id,ok);
    $("#act").dataset.given=given||"";$("#act").dataset.exp=w[0];
  };
  $("#f").onsubmit=e=>{e.preventDefault();const v=$("#in").value.trim();if(v)check(v);};
  $("#chk").onclick=()=>{const v=$("#in").value.trim();if(v)check(v);};
  $("#idk").onclick=()=>check(null);
  setTimeout(()=>$("#in")&&$("#in").focus(),30);
}
function renderCloze(it,gid,idx){
  const g=G[gid];const d=g&&g.drills[idx];if(!d){nextItem();return;}
  const [before,after]=d.q.split("___");
  const w=Math.max(4,Math.max(...d.a.map(a=>a.length))+1);
  view().innerHTML=progressBar()+`<div class="card">
    <div class="spread"><span class="pill ${it.isNew?"":"n"}">${it.isNew?"new":"grammar"}</span><button class="btn ghost small" id="hint" style="padding:4px 10px">Show pattern</button></div>
    <p class="muted small" id="pat" style="margin:8px 0 0">&nbsp;</p>
    <form id="f" class="sent" style="margin:8px 0">${esc(before)}<input type="text" id="in" class="inline-in" style="width:${w}em" autocomplete="off" autocapitalize="off" spellcheck="false" lang="ko">${esc(after)}</form>
    <p class="small"><span class="pill n">${esc(d.h)}</span></p>
    <p class="muted">${esc(d.en)}</p>
    <div id="res"></div></div><div id="act"><button class="btn primary block" id="chk">Check</button><button class="btn ghost block" id="idk" style="margin-top:8px">I don't know</button></div>`;
  $("#hint").onclick=()=>{$("#pat").innerHTML=`<b>${esc(g.form)}</b> — ${esc(g.meaning)}`;};
  const check=(given)=>{
    const ok=given!==null&&d.a.some(a=>norm(a)===norm(given));
    $("#in").disabled=true;
    const full=before+d.a[0]+after;
    $("#res").innerHTML=`<div class="verdict ${ok?"ok":"no"}">${ok?"맞아요 — correct":"Answer: "+esc(d.a[0])}</div>
      <div class="ex"><div class="ko" style="font-size:19px">${esc(full)} ${spkBtn(full)}</div></div>
      <div class="small"><b>${esc(g.form)}</b> — ${esc(g.meaning)}</div>
      ${!ok&&SAMPLE&&given?`<button class="btn ghost small" id="why" style="margin-top:10px;padding:6px 12px">Why was mine wrong?</button><div id="whyout"></div>`:""}`;
    $("#act").innerHTML=gradeButtons(it.id,ok);
    $("#act").dataset.given=given||"";$("#act").dataset.exp=d.a[0];
    const wb=$("#why");if(wb)wb.onclick=()=>explainMistake(g,d,given,full);
  };
  $("#f").onsubmit=e=>{e.preventDefault();const v=$("#in").value.trim();if(v)check(v);};
  $("#chk").onclick=()=>{const v=$("#in").value.trim();if(v)check(v);};
  $("#idk").onclick=()=>check(null);
  setTimeout(()=>$("#in")&&$("#in").focus(),30);
}
async function explainMistake(g,d,given,full){
  const out=$("#whyout");$("#why").remove();out.innerHTML=`<div class="fb muted">Asking Claude<span class="dots">…</span></div>`;
  try{
    const r=await ask(`You are a concise Korean grammar tutor for an intermediate learner whose explanations language is English.
Exercise: fill the blank in "${d.q}" (hint: ${d.h}). Target grammar: ${g.form} (${g.meaning}). Expected answer: "${d.a.join('" or "')}". Full sentence: "${full}".
The learner wrote: "${given}".
Explain in 2-4 short sentences why the learner's form is wrong or unnatural here (conjugation, wrong grammar, spelling, tense…). If the learner's answer is actually also correct and natural, say so clearly.
Reply ONLY with JSON: {"alsoCorrect": boolean, "explanation": "..."}`);
    out.innerHTML=`<div class="fb">${r.alsoCorrect?'<b class="verdict ok">Claude thinks yours works too.</b> ':""}${esc(r.explanation)}</div>`;
  }catch(e){out.innerHTML=`<div class="fb muted">${esc(errText(e))}</div>`;}
}
function renderLesson(gid,inSession,isReview){
  const g=G[gid];
  view().innerHTML=(inSession?progressBar():`<p><a href="#grammar" class="muted small">← All grammar</a></p>`)+`<div class="card">
    <div class="row"><span class="pill">${inSession&&!isReview?"new grammar":S.seenG[gid]?"learned":"not started"}</span><span class="pill n">${esc(g.cat||"")} · ${LV[g.lv]||""}</span></div>
    <div class="big" style="font-size:34px">${esc(g.form)}</div>
    <p style="font-size:18px;margin:0 0 12px">${esc(g.meaning)}</p>
    <p class="notes">${esc(g.notes)}</p>
    ${g.ex.map(e=>`<div class="ex"><div class="ko">${esc(e[0])} ${spkBtn(e[0])}</div><div class="muted small">${esc(e[1])}</div></div>`).join("")}
  </div>
  <div class="row">${inSession?`<button class="btn primary block" id="go">Practice it</button>`
    :S.seenG[gid]?`<button class="btn primary" id="drill">Drill this now</button>${SAMPLE?`<a class="btn" href="#write" data-wg="${gid}">Write a sentence</a>`:""}`
    :`<button class="btn primary" id="learn">Learn this now</button>`}</div>
  ${!inSession?`<h2>Practice sentences</h2><div class="card"><ul class="list">${g.drills.map((d,i)=>{const c=S.cards["g|"+gid+"|"+i];return `<li style="cursor:default"><span class="ko">${esc(d.q.replace("___",d.a[0]))}</span>${c?`<span class="pill ${c.reps>1?"j":"n"}">${c.reps>1?"solid":"learning"}</span>`:""}</li>`;}).join("")}</ul></div>`:""}`;
  if($("#go"))$("#go").onclick=()=>{if(!isReview&&!S.seenG[gid]){S.seenG[gid]=Date.now();if(!SESSION.forced)logToday().newG++;save();}nextItem();};
  if($("#learn"))$("#learn").onclick=()=>startGrammar(gid);
  if($("#drill"))$("#drill").onclick=()=>{const q=shuffle(g.drills.map((_,i)=>({id:"g|"+gid+"|"+i,retry:false})));SESSION={kind:"grammar",queue:q,done:0,total:q.length,ok:0,wrong:[]};nextItem();};
  window.scrollTo(0,0);
}

// ---------- tabs ----------
function streak(){let n=0;let t=Date.now();if(!(S.log[dayKey(t)]&&S.log[dayKey(t)].rev))t-=DAY;while(S.log[dayKey(t)]&&S.log[dayKey(t)].rev){n++;t-=DAY;}return n;}
function renderToday(){
  const vd=dueIds("v|").filter(id=>S.settings.production||id.endsWith("|r")).length,vn=newVocabAvailable().length;
  const gd=dueIds("g|").length,gp=grammarNewQuota()>0?nextGrammarPoint():null;
  const L=logToday();
  const h=new Date().getHours();const greet=h<11?"좋은 아침이에요":h<18?"안녕하세요":"좋은 저녁이에요";
  view().innerHTML=`<h1>${greet}, Nik</h1><p class="sub">${L.rev?`${L.rev} review${L.rev===1?"":"s"} today · ${streak()} day streak`:streak()?`${streak()} day streak — keep it going`:"About 10 minutes a day is enough."}</p>
  <div class="card"><div class="spread"><div><h2 style="margin:0">Vocabulary</h2><p class="muted small" style="margin:2px 0 0">${vd} due · ${vn} new</p></div>
    <button class="btn ${vd+vn?"seal":""}" id="sv" ${vd+vn?"":"disabled"}>${vd+vn?"Start":"Done ✓"}</button></div></div>
  <div class="card"><div class="spread"><div><h2 style="margin:0">Grammar</h2><p class="muted small" style="margin:2px 0 0">${gd} due${gp?` · new: <span class="ko">${esc(gp.form)}</span>`:""}</p></div>
    <button class="btn ${gd||gp?"seal":""}" id="sg" ${gd||gp?"":"disabled"}>${gd||gp?"Start":"Done ✓"}</button></div></div>
  ${SAMPLE?`<div class="card"><div class="spread"><div><h2 style="margin:0">Write a sentence</h2><p class="muted small" style="margin:2px 0 0">Use a grammar point in your own sentence; Claude corrects it.</p></div><a class="btn" href="#write">Write</a></div></div>`:""}
  ${(!vd&&!vn&&!gd&&!gp)?`<p class="muted small">All done for today. Learn an extra grammar point from the Grammar tab, or raise your daily new limits in Progress.</p>`:""}`;
  $("#sv").onclick=startVocab;$("#sg").onclick=()=>startGrammar();
}
let gLevel=0;
const LV=["","Core","Intermediate","Upper-int."];
function renderGrammarList(){
  const seen=GRAMMAR.filter(g=>S.seenG[g.id]).length;
  const nxt=nextGrammarPoint();
  const item=g=>{const cs=g.drills.map((_,i)=>S.cards["g|"+g.id+"|"+i]).filter(Boolean);const solid=cs.length&&cs.every(c=>c.reps>1);
    const status=S.seenG[g.id]?`<span class="pill ${solid?"j":""}">${solid?"solid":"learning"}</span>`:nxt&&nxt.id===g.id?`<span class="pill">up next</span>`:"";
    return `<li data-open="${g.id}"><div><div class="ko" style="font-size:18px">${esc(g.form)}</div><div class="muted small">${esc(g.meaning)}</div></div><div style="text-align:right;flex-shrink:0">${status}<div class="muted" style="font-size:11px;margin-top:3px">${LV[g.lv]}</div></div></li>`;};
  view().innerHTML=`<h1>문법</h1><p class="sub">${seen} of ${GRAMMAR.length} points learned. New points come in order — core review first, then intermediate, then upper-intermediate. Tap any point to read it, learn it early, or drill it.</p>
  <div class="row" style="margin-bottom:6px">${[0,1,2,3].map(l=>`<button class="btn ${gLevel===l?"primary":""}" data-lv="${l}" style="padding:7px 12px;font-size:14px">${l?LV[l]:"All"}</button>`).join("")}</div>
  ${GCATS.map(cat=>{const gs=GRAMMAR.filter(g=>g.cat===cat&&(!gLevel||g.lv===gLevel)).sort((a,b)=>a.lv-b.lv||a.ord-b.ord);if(!gs.length)return"";
    const done=gs.filter(g=>S.seenG[g.id]).length;
    return `<h2>${esc(cat)} <span class="muted small" style="font-family:var(--sans);font-weight:400">${done}/${gs.length}</span></h2><div class="card" style="padding:4px 18px"><ul class="list">${gs.map(item).join("")}</ul></div>`;}).join("")}`;
  document.querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{gLevel=+b.dataset.lv;renderGrammarList();});
}
let writeTarget=null;
function renderWrite(){
  if(!SAMPLE){view().innerHTML=`<h1>작문</h1><div class="card"><p>Write your own sentences and get them corrected by Claude. This needs an Anthropic API key (usually a few cents a month at this level of use).</p>
    <ol class="small" style="padding-left:18px"><li>Go to <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>, add a little credit, and create a key.</li><li>Paste it below. It's stored only on this phone and sent only to Anthropic.</li></ol>
    <input type="text" id="k" placeholder="sk-ant-…" autocomplete="off" spellcheck="false"><button class="btn primary" id="ks" style="margin-top:10px">Save key</button></div>`;
    $("#ks").onclick=()=>{const v=$("#k").value.trim();if(!v)return;try{localStorage.setItem(KEY_LS,v);}catch(e){}SAMPLE=true;toast("Key saved");renderWrite();};return;}
  const pool=GRAMMAR.filter(g=>S.seenG[g.id]);const list=pool.length?pool:GRAMMAR.slice(0,6);
  if(!writeTarget||!G[writeTarget])writeTarget=list[Math.floor(Math.random()*list.length)].id;
  const known=allVocab().filter(w=>S.cards["v|"+w[0]+"|r"]);const word=known.length?known[Math.floor(Math.random()*known.length)]:null;
  const g=G[writeTarget];
  view().innerHTML=`<h1>작문</h1><p class="sub">Write one sentence. Claude checks grammar, spelling and naturalness.</p>
  <div class="card">
    <label class="small muted">Grammar point</label>
    <select id="gp">${GRAMMAR.map(x=>`<option value="${x.id}" ${x.id===writeTarget?"selected":""}>${esc(x.form)} — ${esc(x.meaning)}${S.seenG[x.id]?"":" (not learned yet)"}</option>`).join("")}</select>
    ${word?`<p class="small" style="margin:12px 0 0">Bonus: also try to use <span class="ko" style="font-size:17px">${esc(word[0])}</span> <span class="muted">(${esc(word[1])})</span></p>`:""}
    <p class="small muted" style="margin:10px 0 6px">Example: <span class="ko">${esc(g.ex[0][0])}</span></p>
    <textarea id="txt" rows="3" lang="ko" placeholder="여기에 문장을 써 보세요…"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="send">Check with Claude</button><button class="btn ghost" id="other">Another prompt</button></div>
    <div id="out"></div></div>
  ${S.writes.length?`<h2>Recent sentences</h2><div class="card"><ul class="list">${S.writes.slice(-8).reverse().map(w=>`<li style="display:block;cursor:default"><div class="ko">${esc(w.corrected||w.text)}</div><div class="muted small">${w.ok?"✓ correct":"✎ corrected"} · ${esc(G[w.g]?G[w.g].form:"")}</div></li>`).join("")}</ul></div>`:""}`;
  $("#gp").onchange=e=>{writeTarget=e.target.value;renderWrite();};
  $("#other").onclick=()=>{writeTarget=null;renderWrite();};
  $("#send").onclick=async()=>{
    const text=$("#txt").value.trim();if(!text)return;
    $("#send").disabled=true;$("#out").innerHTML=`<div class="fb muted">Claude is reading it<span class="dots">…</span></div>`;
    try{
      const r=await ask(`You are a friendly but honest Korean tutor. The learner is intermediate, explanations in English.
Task given to the learner: write one Korean sentence using the grammar ${g.form} (${g.meaning})${word?`, ideally also using the word ${word[0]} (${word[1]})`:""}.
Learner's sentence: "${text}"
Check: grammar (especially ${g.form}), conjugation, particles, spelling/spacing, and whether it sounds natural. Don't nitpick spacing alone as an error if meaning and grammar are right; mention it briefly.
Reply ONLY with JSON:
{"correct": boolean (true if grammatical and natural enough that a Korean would accept it),
 "usedTarget": boolean (did they use ${g.form} correctly),
 "corrected": "the corrected sentence (same as original if fine)",
 "explanation": "2-5 short sentences in English: what's right, what's wrong and why",
 "natural": "one more natural way a native speaker might say it",
 "translation": "English translation of the corrected sentence"}`);
      const ok=!!r.correct&&!!r.usedTarget;
      S.writes.push({t:Date.now(),g:g.id,text,corrected:r.corrected,ok});if(S.writes.length>60)S.writes=S.writes.slice(-60);
      const L=logToday();L.rev++;if(ok)L.ok++;save();
      $("#out").innerHTML=`<div class="fb">
        <div class="verdict ${ok?"ok":"no"}">${ok?"좋아요 — this works":"Almost — here's a fix"}</div>
        ${r.corrected&&norm(r.corrected)!==norm(text)?`<p class="ko" style="font-size:19px;margin:6px 0">${esc(r.corrected)} ${spkBtn(r.corrected)}</p>`:""}
        <p class="muted small" style="margin:0 0 8px">${esc(r.translation||"")}</p>
        <p style="margin:0 0 8px">${esc(r.explanation||"")}</p>
        ${r.natural?`<p class="small" style="margin:0">More natural: <span class="ko" style="font-size:17px">${esc(r.natural)}</span> ${spkBtn(r.natural)}</p>`:""}</div>`;
    }catch(e){$("#out").innerHTML=`<div class="fb muted">${esc(errText(e))}</div>`;}
    $("#send").disabled=false;
  };
}
let wordFilter="";
function wordStatus(w){const r=S.cards["v|"+w[0]+"|r"],p=S.cards["v|"+w[0]+"|p"];if(!r)return["new","n"];const best=Math.min(r.ivl||0,p?p.ivl||0:(S.settings.production?0:r.ivl||0));return best>=21?["known","j"]:["learning",""];}
function renderWords(){
  const all=allVocab();const f=norm(wordFilter).toLowerCase();
  const shown=all.filter(w=>!f||norm(w[0]).includes(f)||w[1].toLowerCase().includes(wordFilter.toLowerCase()));
  const counts={new:0,learning:0,known:0};all.forEach(w=>counts[wordStatus(w)[0]]++);
  view().innerHTML=`<h1>단어</h1><p class="sub">${all.length} words · ${counts.learning} learning · ${counts.known} known</p>
  <div class="card"><h2 style="margin-top:0">Add your own words</h2>
    <p class="muted small" style="margin-top:0">One per line: <span class="ko">단어 = meaning</span>. ${SAMPLE?"Or just the Korean word — Claude fills in the meaning and an example.":""} Words you look up in Sajeon are a good source.</p>
    <textarea id="add" rows="4" lang="ko" placeholder="망설이다 = to hesitate&#10;꾸준히"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn primary" id="addb">Add</button></div><div id="addout"></div></div>
  <input type="text" id="flt" placeholder="Search…" value="${esc(wordFilter)}" style="margin:6px 0 12px">
  <div class="card"><ul class="list">${shown.map(w=>{const [s,c]=wordStatus(w);return `<li data-say-li="${esc(w[0])}"><div><span class="ko" style="font-size:18px">${esc(w[0])}</span> <span class="muted small">${esc(w[1])}</span></div><span class="pill ${c}">${s}</span></li>`;}).join("")||'<li class="muted">No matches</li>'}</ul></div>`;
  $("#flt").oninput=e=>{wordFilter=e.target.value;const pos=e.target.selectionStart;renderWords();const el=$("#flt");el.focus();el.setSelectionRange(pos,pos);};
  $("#addb").onclick=addWords;
}
async function addWords(){
  const lines=$("#add").value.split("\n").map(s=>s.trim()).filter(Boolean);if(!lines.length)return;
  const have=new Set(allVocab().map(w=>w[0]));const ready=[],needs=[];
  for(const l of lines){const parts=l.split(/\s*[=:\t]\s*/);const ko=parts[0].trim();if(!ko||have.has(ko))continue;
    if(parts[1])ready.push([ko,parts[1],parts[2]||"",parts[3]||""]);else needs.push(ko);}
  if(needs.length&&SAMPLE){
    $("#addout").innerHTML=`<div class="fb muted">Claude is writing meanings and examples<span class="dots">…</span></div>`;
    try{
      const r=await ask(`For each Korean word or expression below, give a concise English meaning (most common senses, comma-separated) and one natural, simple example sentence in polite 해요체 with an English translation. Correct obvious spelling mistakes in the headword.
Words: ${JSON.stringify(needs.slice(0,40))}
Reply ONLY with JSON: {"items":[{"ko":"...","en":"...","ex":"...","exEn":"..."}]}`);
      (r.items||[]).forEach(x=>{if(x&&x.ko&&!have.has(x.ko))ready.push([x.ko,x.en||"",x.ex||"",x.exEn||""]);});
    }catch(e){needs.forEach(ko=>ready.push([ko,"(add meaning)","",""]));}
  }else needs.forEach(ko=>ready.push([ko,"(add meaning)","",""]));
  S.custom=(S.custom||[]).concat(ready);save();
  toast(`Added ${ready.length} word${ready.length===1?"":"s"}`);renderWords();
}
function renderStats(){
  const days=[];for(let i=13;i>=0;i--){const k=dayKey(Date.now()-i*DAY);days.push([k,(S.log[k]||{}).rev||0]);}
  const max=Math.max(5,...days.map(d=>d[1]));
  const tot=Object.values(S.log).reduce((a,l)=>({rev:a.rev+(l.rev||0),ok:a.ok+(l.ok||0)}),{rev:0,ok:0});
  const learned=allVocab().filter(w=>S.cards["v|"+w[0]+"|r"]).length;
  const weak=Object.entries(S.cards).filter(([,c])=>c.lapses>0).sort((a,b)=>b[1].lapses-a[1].lapses).slice(0,8);
  const st=S.settings;
  view().innerHTML=`<h1>기록</h1><p class="sub">${S.updatedAt?"Last practiced "+new Date(S.updatedAt).toLocaleString():"No practice yet."}</p>
  <div class="stat"><div><b>${streak()}</b><span>day streak</span></div><div><b>${learned}</b><span>words started</span></div><div><b>${Object.keys(S.seenG).length}</b><span>grammar points</span></div></div>
  <div class="card" style="margin-top:14px"><div class="spread small"><b>Last 14 days</b><span class="muted">${tot.rev?Math.round(tot.ok/tot.rev*100):0}% correct overall</span></div>
    <div class="bars">${days.map(([k,v])=>`<div class="${v?"":"zero"}" style="height:${v/max*100}%" title="${k}: ${v}"></div>`).join("")}</div></div>
  ${weak.length?`<h2>Trickiest items</h2><div class="card"><ul class="list">${weak.map(([id,c])=>`<li style="cursor:default"><span>${labelFor(id)}</span><span class="pill">${c.lapses}× missed</span></li>`).join("")}</ul></div>`:""}
  <h2>Settings</h2><div class="card">
    <div class="spread"><span>New words per day</span><select id="nv" style="width:auto">${[0,5,10,15,20,30].map(n=>`<option ${n===st.newVocab?"selected":""}>${n}</option>`).join("")}</select></div>
    <div class="spread" style="margin-top:10px"><span>New grammar points per day</span><select id="ng" style="width:auto">${[0,1,2,3].map(n=>`<option ${n===st.newGrammar?"selected":""}>${n}</option>`).join("")}</select></div>
    <div class="spread" style="margin-top:10px"><span>Also practice English → Korean (typing)</span><input type="checkbox" id="pr" ${st.production?"checked":""} style="width:22px;height:22px"></div>
  </div>
  <h2>Claude feedback</h2><div class="card">
    <p class="small muted" style="margin-top:0">${apiKey()?"API key saved on this device (…"+esc(apiKey().slice(-4))+").":"No API key yet — the Write tab and \"Why was mine wrong?\" need one."}</p>
    <div class="row"><input type="text" id="k2" placeholder="Paste a new key (sk-ant-…)" autocomplete="off" spellcheck="false" style="flex:1"><button class="btn" id="k2s">Save</button>${apiKey()?`<button class="btn ghost" id="k2r">Remove</button>`:""}</div></div>
  <h2>Your data</h2><div class="card">
    <p class="small muted" style="margin-top:0">Progress is saved on this phone only. Back it up now and then — and send the file to Claude when you ask for improvements. You can also paste a backup from the claude.ai version to carry your progress over.</p>
    <div class="row"><button class="btn" id="dl">Download backup</button><button class="btn" id="exp">Copy backup</button><button class="btn" id="imp">Restore backup</button><button class="btn ghost" id="rst">Reset…</button></div>
    <div id="dataout"></div></div>
  <p class="muted small" style="text-align:center;margin-top:24px">Yeonseup v${APP_VERSION}</p>`;
  $("#k2s").onclick=()=>{const v=$("#k2").value.trim();if(!v)return;try{localStorage.setItem(KEY_LS,v);}catch(e){}SAMPLE=true;toast("Key saved");renderStats();};
  if($("#k2r"))$("#k2r").onclick=()=>{try{localStorage.removeItem(KEY_LS);}catch(e){}SAMPLE=null;toast("Key removed");renderStats();};
  $("#dl").onclick=()=>{const blob=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="yeonseup-backup-"+dayKey()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);};
  $("#nv").onchange=e=>{st.newVocab=+e.target.value;save();};
  $("#ng").onchange=e=>{st.newGrammar=+e.target.value;save();};
  $("#pr").onchange=e=>{st.production=e.target.checked;save();};
  $("#exp").onclick=async()=>{const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);toast("Backup copied");}catch(e){$("#dataout").innerHTML=`<textarea rows="4" style="margin-top:10px" readonly>${esc(txt)}</textarea>`;$("#dataout textarea").select();}};
  $("#imp").onclick=()=>{$("#dataout").innerHTML=`<p class="small" style="margin:12px 0 6px">Choose a backup file, or paste the backup text:</p><input type="file" id="impf" accept=".json,application/json"><textarea id="impt" rows="4" style="margin-top:10px" placeholder="…or paste a backup here"></textarea><button class="btn primary" id="impgo" style="margin-top:8px">Restore</button>`;
    const restore=txt=>confirmBox("Replace the progress on this phone with the backup?","Restore",()=>{try{const x=JSON.parse(txt);if(!x.cards)throw 0;S=hydrate(x);save();toast("Restored");renderStats();}catch(e){toast("That doesn't look like a backup");}});
    $("#impf").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(restore);};
    $("#impgo").onclick=()=>{const t=$("#impt").value.trim();if(t)restore(t);};};
  $("#rst").onclick=()=>confirmBox("Erase all progress? This can't be undone.","Erase",()=>{S=defaultState();save();toast("Progress reset");renderStats();});
}
function confirmBox(msg,label,fn){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><p>${esc(msg)}</p><div class="row"><button class="btn seal" id="cy">${esc(label)}</button><button class="btn" id="cn">Cancel</button></div></div>`;document.body.appendChild(m);m.querySelector("#cy").onclick=()=>{m.remove();fn();};m.querySelector("#cn").onclick=()=>m.remove();}

// ---------- routing & events ----------
function route(){
  const t=(location.hash||"#today").slice(1);
  const tab=["today","grammar","write","words","stats"].includes(t)?t:"today";
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t===tab));
  SESSION=null;
  ({today:renderToday,grammar:renderGrammarList,write:renderWrite,words:renderWords,stats:renderStats})[tab]();
}
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  const say=e.target.closest("[data-say]");if(say){e.preventDefault();speak(say.dataset.say);return;}
  const g=e.target.closest("[data-g]");if(g&&SESSION){const a=$("#act");answer(+g.dataset.g,a&&a.dataset.given,a&&a.dataset.exp);return;}
  const op=e.target.closest("[data-open]");if(op){renderLesson(op.dataset.open,false);return;}
  const wg=e.target.closest("[data-wg]");if(wg){writeTarget=wg.dataset.wg;if(location.hash==="#write"){e.preventDefault();route();}return;}
  const li=e.target.closest("[data-say-li]");if(li){speak(li.dataset.sayLi);return;}
  const q=e.target.closest("[data-quit]");if(q&&SESSION){e.preventDefault();SESSION=null;location.hash="#today";route();}
});
document.addEventListener("keydown",e=>{
  if(!SESSION)return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(e.key===" "&&tag!=="input"&&tag!=="textarea"&&$("#show")){e.preventDefault();$("#show").click();return;}
  if(e.key==="Enter"&&tag!=="input"&&tag!=="textarea"){const s=$(".grades .sug");if(s){e.preventDefault();s.click();}else if($("#go")){e.preventDefault();$("#go").click();}}
  if(tag!=="input"&&tag!=="textarea"&&["1","2","3","4"].includes(e.key)){const bs=document.querySelectorAll(".grades .btn");const b=bs[+e.key-1];if(b){e.preventDefault();b.click();}}
});
route();
// offline support
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)toast("Updated — reopen the app to get the new version");});});
  }).catch(()=>{});
}
</script>
