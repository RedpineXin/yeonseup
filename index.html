<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>연습 Yeonseup</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f0e6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171512" media="(prefers-color-scheme: dark)">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="연습">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f0e6; --card:#fffdf8; --ink:#1e1b17; --muted:#6f685d; --line:#e2d9c8;
  --seal:#b8432f; --seal-soft:#f3dcd4; --jade:#2f6b57; --jade-soft:#d7e8df; --gold:#a8792a;
  --shadow:0 1px 0 rgba(30,27,23,.04),0 8px 24px -12px rgba(30,27,23,.18);
  --serif:"Gowun Batang",ui-serif,Georgia,serif; --sans:"IBM Plex Sans KR",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#171512; --card:#211e1a; --ink:#f0e9dc; --muted:#a59c8d; --line:#3a352d;
  --seal:#e0705b; --seal-soft:#3d2620; --jade:#6fbf9f; --jade-soft:#1f332b; --gold:#d6a752;
  --shadow:0 1px 0 rgba(0,0,0,.2),0 8px 24px -12px rgba(0,0,0,.6);}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
nav{padding-bottom:env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:4px 2px 14px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand .seal{font-family:var(--serif);font-weight:700;font-size:26px;color:var(--seal);letter-spacing:.02em}
.brand .latin{font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--jade)} .sync.err i{background:var(--seal)}
nav{position:fixed;left:0;right:0;bottom:0;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);z-index:5}
nav .in{max-width:640px;margin:0 auto;display:flex}
nav a{flex:1;text-align:center;padding:10px 0 14px;font-size:12px;color:var(--muted);text-decoration:none;letter-spacing:.03em}
nav a b{display:block;font-family:var(--serif);font-size:18px;font-weight:400;color:var(--ink);opacity:.55}
nav a.on{color:var(--seal)} nav a.on b{color:var(--seal);opacity:1}
h1{font-family:var(--serif);font-weight:700;font-size:28px;margin:6px 0 4px;letter-spacing:-.01em}
h2{font-family:var(--serif);font-size:20px;margin:28px 0 10px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow);margin-bottom:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.big{font-family:var(--serif);font-size:44px;line-height:1.15;font-weight:700;margin:6px 0;word-break:keep-all}
.ko{font-family:var(--serif)}
.muted{color:var(--muted)} .small{font-size:13px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--seal-soft);color:var(--seal);font-weight:500}
.pill.j{background:var(--jade-soft);color:var(--jade)}
.pill.n{background:transparent;border:1px solid var(--line);color:var(--muted)}
.btn{appearance:none;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 16px;cursor:pointer;font-weight:500;transition:transform .05s}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.seal{background:var(--seal);border-color:var(--seal);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.4;cursor:default}
.btn.block{width:100%}
.btn.small{padding:10px 4px;font-size:14px;white-space:nowrap}
.icon{appearance:none;border:1px solid var(--line);background:transparent;border-radius:99px;width:38px;height:38px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.icon svg{width:18px;height:18px}
input[type=text],textarea,select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--paper);outline:none}
input[type=text]:focus,textarea:focus{border-color:var(--ink)}
.answer{font-size:22px;font-family:var(--serif);text-align:center}
input[type=text].inline-in{display:inline-block;width:auto;min-width:5.5em;font-family:var(--serif);font-size:inherit;padding:2px 8px;margin:0 2px;border-radius:8px;border:1.5px dashed var(--seal);background:var(--seal-soft);text-align:center}
.sent{font-family:var(--serif);font-size:24px;line-height:1.7;word-break:keep-all}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.grades.three{grid-template-columns:repeat(3,1fr)}
.grades .btn{padding:12px 4px;font-size:14px}
.grades .btn small{display:block;font-size:11px;color:var(--muted);font-weight:400}
.grades .btn.sug{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.verdict{font-weight:600;margin:14px 0 4px}
.verdict.ok{color:var(--jade)} .verdict.no{color:var(--seal)}
.progress{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin:4px 0 16px}
.progress i{display:block;height:100%;background:var(--seal);transition:width .3s}
.ex{border-left:3px solid var(--line);padding:4px 0 4px 12px;margin:12px 0}
.ex .ko{font-size:18px}
.list{list-style:none;padding:0;margin:0}
.list li{padding:12px 2px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center;cursor:pointer}
.list li:last-child{border-bottom:0}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}
.stat b{display:block;font-family:var(--serif);font-size:26px}
.stat span{font-size:12px;color:var(--muted)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:8px}
.bars div{flex:1;background:var(--seal);opacity:.8;border-radius:3px 3px 0 0;min-height:2px;position:relative}
.bars div.zero{background:var(--line)}
.notes{white-space:pre-line}
a{color:var(--seal)}
a.btn{color:inherit;text-decoration:none}
a.btn.primary{color:var(--paper)}
.hide{display:none!important}
.fb{background:var(--paper);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:15px}
.dots{display:inline-block;animation:p 1s infinite}
@keyframes p{50%{opacity:.3}}
.toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;z-index:9;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:10;padding:20px}
.modal .card{max-width:420px;width:100%}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="seal">연습</span><span class="latin">Yeonseup</span></div>

  </header>
  <main id="view"></main>
</div>

{id:"girohada",form:"-기로 하다",meaning:"decide to; agree/plan to",

  {q:"무거우면 제가 ___ 줄게요.",h:"돕다",a:["도와"],en:"If it's heavy, I'll help you."}]},
{id:"jimalda",form:"-지 말다",meaning:"don't (negative command / suggestion)",
 notes:"Stem + 지 마세요 (please don't), 지 마 (casual), 지 맙시다 / 지 말자 (let's not). Only for commands and suggestions — for statements use 안 or -지 않다.",
 ex:[["너무 걱정하지 마세요.","Don't worry too much."]],
 drills:[
  {q:"여기서 사진을 ___.",h:"찍다 → please don't",a:["찍지 마세요","찍지 마십시오"],en:"Please don't take photos here."},
  {q:"너무 ___.",h:"걱정하다 → please don't",a:["걱정하지 마세요"],en:"Don't worry too much."},
  {q:"내일은 늦게 ___.",h:"오다 → please don't",a:["오지 마세요"],en:"Please don't come late tomorrow."},
  {q:"우리 오늘은 술 ___.",h:"마시다 → let's not",a:["마시지 맙시다","마시지 말자","마시지 말아요"],en:"Let's not drink today."}]},
{id:"modifiers",form:"-(으)ㄴ / -는 / -(으)ㄹ + noun",meaning:"modifiers: the movie (that) I saw / am watching / will watch",
 notes:"Action verbs: past -(으)ㄴ (본 영화), present -는 (보는 영화), future -(으)ㄹ (볼 영화). Adjectives: -(으)ㄴ (큰 집, 좋은 사람). 있다/없다 take -는 (재미있는 책). ㄹ-stem drops ㄹ before ㄴ: 살다 → 사는, 산.",
 ex:[["어제 본 영화가 재미있었어요.","The movie I saw yesterday was fun."],["지금 듣는 노래가 뭐예요?","What's the song you're listening to now?"]],
 drills:[
  {q:"어제 ___ 영화가 재미있었어요.",h:"보다, past",a:["본"],en:"The movie I saw yesterday was fun."},
  {q:"지금 ___ 노래가 뭐예요?",h:"듣다, present",a:["듣는"],en:"What's the song you're listening to now?"},
  {q:"내일 ___ 옷을 골랐어요.",h:"입다, future",a:["입을"],en:"I picked out the clothes I'll wear tomorrow."},
  {q:"저기 키가 ___ 사람이 누구예요?",h:"크다",a:["큰"],en:"Who's that tall person over there?"}]},
{id:"honorific",form:"-(으)시- (honorific)",meaning:"showing respect to the subject (elders, superiors)",
 notes:"Vowel stem + 시, consonant stem + 으시: 가세요, 읽으세요; past 가셨어요. ㄹ-stem drops ㄹ: 살다 → 사세요. Special verbs: 먹다/마시다 → 드시다, 자다 → 주무시다, 있다 → 계시다, 말하다 → 말씀하시다. Subject particle 께서.",
 ex:[["할머니께서 신문을 읽으세요.","Grandma is reading the newspaper."]],
 drills:[
  {q:"할머니께서 신문을 ___.",h:"읽다, honorific",a:["읽으세요","읽으십니다"],en:"Grandma is reading the newspaper."},
  {q:"선생님은 어디에 ___?",h:"살다, honorific",a:["사세요","사십니까"],en:"Where do you live, teacher?"},
  {q:"아버지께서 어제 ___.",h:"오다, honorific past",a:["오셨어요","오셨습니다"],en:"My father came yesterday."},
  {q:"할아버지께서 지금 ___ 계세요.",h:"자다 (special honorific verb)",a:["주무시고"],en:"Grandpa is sleeping right now."}]},
{id:"neyo",form:"-네요",meaning:"oh, … (surprise / noticing something now)",
 notes:"Stem + 네요: 좋네요, 잘하네요; noun N(이)네요. ㄹ-stem drops ㄹ: 멀다 → 머네요. Reacts to something you just noticed.",
 ex:[["와, 한국어를 정말 잘하시네요!","Wow, you speak Korean really well!"]],
 drills:[
  {q:"오늘 날씨가 정말 ___.",h:"좋다",a:["좋네요"],en:"Oh, the weather's really nice today."},
  {q:"와, 한국어를 정말 잘 ___!",h:"하다",a:["하네요","하시네요"],en:"Wow, you speak Korean really well!"},
  {q:"벌써 ___.",h:"12시이다",a:["12시네요","12시이네요","열두시네요"],en:"Oh, it's already 12."},
  {q:"오늘은 길이 많이 ___.",h:"막히다",a:["막히네요"],en:"Wow, traffic is really bad today."}]},
{id:"jiyo",form:"-지요 (-죠)",meaning:"…, right? (seeking agreement / softly stating)",
 notes:"Stem + 지요, usually shortened to 죠: 있죠?, 맛있죠? Noun: N(이)죠. Also used for a soft statement: 그렇죠.",
 ex:[["이거 정말 맛있죠?","This is really good, isn't it?"]],
 drills:[
  {q:"내일 회의 ___?",h:"있다",a:["있죠","있지요"],en:"There's a meeting tomorrow, right?"},
  {q:"민수 씨는 한국 ___?",h:"사람이다",a:["사람이죠","사람이지요"],en:"Minsu is Korean, right?"},
  {q:"이거 정말 ___?",h:"맛있다",a:["맛있죠","맛있지요"],en:"This is really good, isn't it?"},
  {q:"오늘 날씨가 많이 ___?",h:"춥다",a:["춥죠","춥지요"],en:"It's really cold today, isn't it?"}]},
{id:"compare",form:"보다 / 처럼 / 만큼",meaning:"than / like / as … as",
 notes:"N보다 (더) = more than N: 형보다 커요. N처럼 = like N (manner/similarity): 아이처럼 웃어요. N만큼 = as much as N: 저만큼 커요.",
 ex:[["오늘은 어제보다 더 추워요.","Today is colder than yesterday."]],
 drills:[
  {q:"제가 형___ 키가 더 커요.",h:"보다 / 처럼 / 만큼",a:["보다"],en:"I'm taller than my older brother."},
  {q:"그 사람은 아이___ 웃어요.",h:"보다 / 처럼 / 만큼",a:["처럼"],en:"That person laughs like a child."},
  {q:"동생도 저___ 키가 커요.",h:"보다 / 처럼 / 만큼",a:["만큼"],en:"My younger sibling is as tall as me."},
  {q:"오늘은 어제___ 더 추워요.",h:"보다 / 처럼 / 만큼",a:["보다"],en:"Today is colder than yesterday."}]},
{id:"doman",form:"도 / 만 / 밖에",meaning:"also / only / nothing but (밖에 + negative)",
 notes:"도 = also, too. 만 = only (neutral). 밖에 = only, with a negative verb and a sense of \"not enough\": 천 원밖에 없어요.",
 ex:[["시간이 10분밖에 안 남았어요.","There are only 10 minutes left."]],
 drills:[
  {q:"저는 커피___ 마셔요. 차는 안 마셔요.",h:"도 / 만 / 밖에",a:["만"],en:"I only drink coffee. I don't drink tea."},
  {q:"지갑에 돈이 천 원___ 없어요.",h:"도 / 만 / 밖에",a:["밖에"],en:"I only have 1,000 won in my wallet."},
  {q:"저___ 가고 싶어요.",h:"도 / 만 / 밖에",a:["도"],en:"I want to go too."},
  {q:"시간이 10분___ 안 남았어요.",h:"도 / 만 / 밖에",a:["밖에"],en:"There are only 10 minutes left."}]},
{id:"gonaseo",form:"-고 나서",meaning:"after finishing (doing)",
 notes:"Action stem + 고 나서: 먹고 나서, 하고 나서. Stresses that the first action is completed before the next. Close to -(으)ㄴ 후에.",
 ex:[["밥을 먹고 나서 이를 닦아요.","I brush my teeth after eating."]],
 drills:[
  {q:"숙제를 ___ 놀아요.",h:"하다 + after finishing",a:["하고 나서","하고 나서야"],en:"I play after finishing my homework."},
  {q:"밥을 ___ 이를 닦아요.",h:"먹다 + after finishing",a:["먹고 나서"],en:"I brush my teeth after eating."},
  {q:"영화를 ___ 저녁을 먹었어요.",h:"보다 + after finishing",a:["보고 나서"],en:"We had dinner after watching the movie."},
  {q:"이 책을 다 ___ 빌려줄게요.",h:"읽다 + after finishing",a:["읽고 나서"],en:"I'll lend you this book after I finish it."}]},
{id:"jamaja",form:"-자마자",meaning:"as soon as",
 notes:"Action stem + 자마자, no tense on it: 도착하자마자, 듣자마자.",
 ex:[["집에 도착하자마자 잤어요.","I went to sleep as soon as I got home."]],
 drills:[
  {q:"집에 ___ 잤어요.",h:"도착하다",a:["도착하자마자"],en:"I fell asleep as soon as I got home."},
  {q:"수업이 ___ 밖으로 나갔어요.",h:"끝나다",a:["끝나자마자"],en:"I went outside as soon as class ended."},
  {q:"그 소식을 ___ 전화했어요.",h:"듣다",a:["듣자마자"],en:"I called as soon as I heard the news."},
  {q:"아침에 ___ 커피를 마셔요.",h:"일어나다",a:["일어나자마자"],en:"I drink coffee as soon as I get up."}]},
{id:"myeonseo",form:"-(으)면서",meaning:"while (doing two things at once)",
 notes:"Vowel/ㄹ stem + 면서 (마시면서, 살면서); consonant stem + 으면서 (먹으면서). ㄷ-irregular: 듣다 → 들으면서, 걷다 → 걸으면서. Same subject.",
 ex:[["음악을 들으면서 공부해요.","I study while listening to music."]],
 drills:[
  {q:"음악을 ___ 공부해요.",h:"듣다",a:["들으면서"],en:"I study while listening to music."},
  {q:"밥을 ___ 텔레비전을 봐요.",h:"먹다",a:["먹으면서"],en:"I watch TV while eating."},
  {q:"공원을 ___ 이야기했어요.",h:"걷다",a:["걸으면서"],en:"We talked while walking in the park."},
  {q:"커피를 ___ 일해요.",h:"마시다",a:["마시면서"],en:"I work while drinking coffee."}]},
{id:"eunji",form:"-(으)ㄴ 지 (시간이) 되다",meaning:"it's been (time) since …",
 notes:"Past modifier -(으)ㄴ + 지 + time + 되다/넘다: 배운 지 2년 됐어요. ㄹ-stem: 살다 → 산 지.",
 ex:[["한국어를 배운 지 2년 됐어요.","It's been two years since I started learning Korean."]],
 drills:[
  {q:"한국어를 ___ 2년 됐어요.",h:"배우다",a:["배운 지"],en:"It's been two years since I started learning Korean."},
  {q:"서울에 ___ 얼마나 됐어요?",h:"오다",a:["온 지"],en:"How long has it been since you came to Seoul?"},
  {q:"베를린에 ___ 3년이 넘었어요.",h:"살다",a:["산 지"],en:"I've been living in Berlin for over three years."},
  {q:"밥을 ___ 한 시간밖에 안 됐어요.",h:"먹다",a:["먹은 지"],en:"It's only been an hour since I ate."}]},
{id:"gisijak",form:"-기 시작하다",meaning:"start doing",
 notes:"Stem + 기 시작하다: 오기 시작했어요, 배우기 시작했어요.",
 ex:[["갑자기 비가 오기 시작했어요.","It suddenly started raining."]],
 drills:[
  {q:"갑자기 비가 ___ 시작했어요.",h:"오다",a:["오기"],en:"It suddenly started raining."},
  {q:"작년부터 중국어를 ___ 시작했어요.",h:"배우다",a:["배우기"],en:"I started learning Chinese last year."},
  {q:"아이가 갑자기 ___ 시작했어요.",h:"울다",a:["울기"],en:"The child suddenly started crying."},
  {q:"다음 주부터 새 회사에서 ___ 시작해요.",h:"일하다",a:["일하기"],en:"I start working at a new company next week."}]},
{id:"aitda",form:"-아/어 있다",meaning:"be in a state (result of an action remains)",
 notes:"Intransitive/passive stem + 아/어 있다: 열려 있다 (be open), 앉아 있다 (be seated), 걸려 있다 (be hanging). Compare -고 있다 (the action in progress): 앉고 있어요 = in the middle of sitting down.",
 ex:[["문이 열려 있어요.","The door is open."]],
 drills:[
  {q:"문이 ___ 있어요.",h:"열리다",a:["열려"],en:"The door is open."},
  {q:"민수 씨는 의자에 ___ 있어요.",h:"앉다",a:["앉아"],en:"Minsu is sitting on the chair."},
  {q:"벽에 그림이 ___ 있어요.",h:"걸리다",a:["걸려"],en:"There's a picture hanging on the wall."},
  {q:"공원에 꽃이 많이 ___ 있어요.",h:"피다",a:["피어"],en:"Lots of flowers are in bloom in the park."}]},
{id:"ryeogohada",form:"-(으)려고 하다",meaning:"plan to, intend to; be about to",
 notes:"Vowel/ㄹ stem + 려고 하다 (가려고 해요, 만들려고 해요); consonant stem + 으려고 하다 (읽으려고 해요). Past -(으)려고 했어요 = \"I was going to (but…)\".",
 ex:[["내일부터 운동을 시작하려고 해요.","I'm planning to start working out tomorrow."]],
 drills:[
  {q:"내일부터 운동을 ___ 해요.",h:"시작하다",a:["시작하려고"],en:"I'm planning to start working out from tomorrow."},
  {q:"지금 막 ___ 했어요.",h:"나가다",a:["나가려고"],en:"I was just about to leave."},
  {q:"올해는 책을 많이 ___ 해요.",h:"읽다",a:["읽으려고"],en:"This year I plan to read a lot of books."},
  {q:"주말에 김치를 ___ 해요.",h:"만들다",a:["만들려고"],en:"I'm planning to make kimchi this weekend."}]},
{id:"eullaeyo",form:"-(으)ㄹ래요",meaning:"I'll have / I want to; do you want to …? (casual-polite)",
 notes:"Vowel/ㄹ stem + ㄹ래요 (갈래요, 만들래요); consonant stem + 을래요 (먹을래요). Statement = my choice; question = asking the listener's wish. Not for superiors in formal settings.",
 ex:[["저는 커피 마실래요.","I'll have coffee."],["같이 갈래요?","Do you want to go together?"]],
 drills:[
  {q:"저는 커피 ___.",h:"마시다",a:["마실래요"],en:"I'll have coffee."},
  {q:"점심에 뭐 ___?",h:"먹다",a:["먹을래요"],en:"What do you want to eat for lunch?"},
  {q:"주말에 같이 ___?",h:"가다",a:["갈래요"],en:"Want to go together this weekend?"},
  {q:"오늘은 그냥 집에 ___.",h:"있다",a:["있을래요"],en:"I'll just stay home today."}]},
{id:"jianhado",form:"-지 않아도 되다",meaning:"don't have to",
 notes:"Stem + 지 않아도 되다, or the shorter 안 + -아/어도 되다: 가지 않아도 돼요 = 안 가도 돼요.",
 ex:[["내일은 회사에 가지 않아도 돼요.","I don't have to go to the office tomorrow."]],
 drills:[
  {q:"내일은 회사에 ___ 돼요.",h:"가다 → don't have to",a:["가지 않아도","안 가도"],en:"I don't have to go to the office tomorrow."},
  {q:"오늘은 돈을 ___ 돼요.",h:"내다 → don't have to",a:["내지 않아도","안 내도"],en:"You don't have to pay today."},
  {q:"너무 ___ 돼요.",h:"걱정하다 → don't have to",a:["걱정하지 않아도","걱정 안 해도","안 걱정해도"],en:"You don't need to worry so much."},
  {q:"예약은 ___ 돼요.",h:"하다 → don't have to",a:["하지 않아도","안 해도"],en:"You don't need to make a reservation."}]},
{id:"euljulalda",form:"-(으)ㄹ 줄 알다/모르다",meaning:"know how to / not know how to",
 notes:"Vowel/ㄹ stem + ㄹ 줄 알다 (할 줄 알아요); consonant stem + 을 줄 (읽을 줄). About skills you've learned (swimming, driving, cooking).",
 ex:[["운전할 줄 알아요?","Do you know how to drive?"]],
 drills:[
  {q:"저는 수영을 ___ 몰라요.",h:"하다",a:["할 줄"],en:"I don't know how to swim."},
  {q:"운전을 ___ 알아요?",h:"하다",a:["할 줄"],en:"Do you know how to drive?"},
  {q:"엄마는 김치를 ___ 아세요.",h:"담그다",a:["담글 줄"],en:"My mom knows how to make kimchi."},
  {q:"피아노를 ___ 몰라요.",h:"치다",a:["칠 줄"],en:"I don't know how to play the piano."}]},
{id:"aboida",form:"-아/어 보이다",meaning:"look, seem (based on appearance)",
 notes:"Adjective stem + 아/어 보이다: 피곤해 보여요, 맛있어 보여요, 슬퍼 보여요. For nouns: N처럼 보이다.",
 ex:[["오늘 좀 피곤해 보여요.","You look a bit tired today."]],
 drills:[
  {q:"오늘 좀 ___.",h:"피곤하다 → look (polite present)",a:["피곤해 보여요"],en:"You look a bit tired today."},
  {q:"이 케이크 정말 ___.",h:"맛있다 → look",a:["맛있어 보여요"],en:"This cake looks really delicious."},
  {q:"그 옷을 입으니까 ___.",h:"젊다 → look",a:["젊어 보여요"],en:"You look young in those clothes."},
  {q:"민수 씨 표정이 좀 ___.",h:"슬프다 → look",a:["슬퍼 보여요"],en:"Minsu looks a bit sad."}]},
{id:"get",form:"-겠-",meaning:"must be, I bet (reaction / supposition)",
 notes:"Stem + 겠어요: 맛있겠어요 (that must be tasty), 피곤하겠어요 (you must be tired). Also formal intention (제가 하겠습니다) and fixed politeness (알겠습니다, 처음 뵙겠습니다).",
 ex:[["와, 맛있겠어요!","Wow, that looks delicious!"]],
 drills:[
  {q:"와, 이 케이크 ___!",h:"맛있다",a:["맛있겠어요","맛있겠다"],en:"Wow, this cake must be delicious!"},
  {q:"오늘 열 시간 일했어요? 정말 ___.",h:"피곤하다",a:["피곤하겠어요","피곤하시겠어요"],en:"You worked ten hours today? You must be exhausted."},
  {q:"내일은 눈이 와서 ___.",h:"춥다",a:["춥겠어요"],en:"It's going to snow tomorrow, so it'll be cold."},
  {q:"이사도 하고 시험도 있으면 정말 ___.",h:"바쁘다",a:["바쁘겠어요","바쁘시겠어요"],en:"Moving and exams at the same time — you must be really busy."}]},
{id:"ado2",form:"-아/어도",meaning:"even if, even though",
 notes:"Stem + 아/어도: 와도, 바빠도, 비싸도. With 아무리 = \"no matter how\": 아무리 운동해도.",
 ex:[["아무리 바빠도 밥은 꼭 먹어요.","No matter how busy I am, I always eat."]],
 drills:[
  {q:"내일 비가 ___ 갈 거예요.",h:"오다",a:["와도"],en:"Even if it rains tomorrow, I'll go."},
  {q:"아무리 ___ 살이 안 빠져요.",h:"운동하다",a:["운동해도"],en:"No matter how much I exercise, I don't lose weight."},
  {q:"아무리 ___ 밥은 꼭 먹어요.",h:"바쁘다",a:["바빠도"],en:"No matter how busy I am, I always eat."},
  {q:"좀 ___ 이 가방을 사고 싶어요.",h:"비싸다",a:["비싸도"],en:"Even if it's a bit pricey, I want to buy this bag."}]},
{id:"nominal",form:"-는 것 / -기 (verb → noun)",meaning:"doing X (turning a verb into a noun)",
 notes:"-는 것 (often -는 거, -는 게 = 것이, -는 걸 = 것을) is the general way: 요리하는 걸 좋아해요. -기 is common with 좋다/싫다/쉽다/어렵다 and in set phrases: 배우기 어려워요, 취미는 사진 찍기.",
 ex:[["저는 요리하는 걸 좋아해요.","I like cooking."]],
 drills:[
  {q:"한국어를 ___ 재미있어요.",h:"배우다 + subject",a:["배우는 게","배우는 것이","배우는 거","배우기가"],en:"Learning Korean is fun."},
  {q:"저는 ___ 좋아해요.",h:"요리하다 + object",a:["요리하는 걸","요리하는 것을","요리하기를","요리하는 거"],en:"I like cooking."},
  {q:"매일 ___ 쉽지 않아요.",h:"운동하다 + subject",a:["운동하는 게","운동하는 것이","운동하기가","운동하는 거"],en:"Working out every day isn't easy."},
  {q:"혼자 밥 ___ 싫어요.",h:"먹다 + subject",a:["먹는 게","먹는 것이","먹는 거","먹기"],en:"I don't like eating alone."}]},

  {q:"배가 아파서 밥을 ___ 먹었어요.",h:"안 / 못",a:["못"],en:"My stomach hurt, so I couldn't eat."},
  {q:"수영을 배운 적이 없어서 수영을 ___ 해요.",h:"안 / 못",a:["못"],en:"I've never learned, so I can't swim."},
  {q:"오늘은 귀찮아서 운동을 ___ 할 거예요.",h:"안 / 못",a:["안"],en:"I can't be bothered today, so I'm not going to work out."}]},
{id:"go",form:"-고",meaning:"and (linking verbs and adjectives)",cat:"Sentence basics",
 notes:"Stem + 고, with any verb or adjective: 싸고 맛있어요, 숙제를 하고 잤어요. Tense goes on the final verb only.",
 ex:[["이 식당은 싸고 맛있어요.","This restaurant is cheap and good."]],
 drills:[
  {q:"저는 커피를 ___ 동생은 차를 마셔요.",h:"마시다",a:["마시고"],en:"I drink coffee and my younger sibling drinks tea."},
  {q:"이 식당은 ___ 맛있어요.",h:"싸다",a:["싸고"],en:"This restaurant is cheap and good."},
  {q:"숙제를 ___ 잤어요.",h:"하다",a:["하고"],en:"I did my homework and went to bed."},
  {q:"형은 키가 ___ 잘생겼어요.",h:"크다",a:["크고"],en:"My older brother is tall and handsome."}]},
{id:"euseyo",form:"-(으)세요",meaning:"please do (polite request)",cat:"Sentence basics",
 notes:"Vowel stem + 세요 (가세요, 기다리세요); consonant stem + 으세요 (앉으세요, 읽으세요); ㄹ-stem drops ㄹ (만들다 → 만드세요). It's also the honorific present: 어디 가세요?",
 ex:[["여기 앉으세요.","Please sit here."]],
 drills:[
  {q:"여기 ___.",h:"앉다",a:["앉으세요"],en:"Please sit here."},
  {q:"조금만 천천히 ___.",h:"말하다",a:["말하세요","말씀하세요"],en:"Please speak a bit more slowly."},
  {q:"잠깐만 ___.",h:"기다리다",a:["기다리세요"],en:"Please wait a moment."},
  {q:"이 책을 꼭 ___.",h:"읽다",a:["읽으세요"],en:"Be sure to read this book."}]},
{id:"eupsida",form:"-(으)ㅂ시다",meaning:"let's (polite suggestion)",cat:"Sentence basics",
 notes:"Vowel stem + ㅂ시다 (갑시다); consonant stem + 읍시다 (먹읍시다); ㄹ-stem drops ㄹ (만듭시다). Fine among equals; to a superior, -(으)세요 or -(으)ㄹ까요? sounds softer. Casual: -자.",
 ex:[["같이 갑시다.","Let's go together."]],
 drills:[
  {q:"같이 ___.",h:"가다",a:["갑시다"],en:"Let's go together."},
  {q:"여기에서 ___.",h:"먹다",a:["먹읍시다"],en:"Let's eat here."},
  {q:"내일 다시 ___.",h:"만나다",a:["만납시다"],en:"Let's meet again tomorrow."},
  {q:"잠깐 ___.",h:"쉬다",a:["쉽시다"],en:"Let's take a short break."}]},
// ---------- TOPIK 4 ----------
{id:"ndedaga",form:"-(으)ㄴ/는 데다가",meaning:"on top of, in addition to",cat:"Contrast & conditions",
 notes:"Action verbs and 있다/없다: -는 데다가 (오는 데다가). Adjectives: -(으)ㄴ 데다가 (넓은 데다가). Past action: -(으)ㄴ 데다가 (잔 데다가). Both parts point the same way (both good or both bad).",
 ex:[["이 식당은 음식이 맛있는 데다가 값도 싸요.","This restaurant's food is good, and on top of that it's cheap."]],
 drills:[
  {q:"이 식당은 음식이 ___ 값도 싸요.",h:"맛있다",a:["맛있는 데다가","맛있는 데다"],en:"The food here is good, and it's cheap too."},
  {q:"오늘은 비가 ___ 바람도 많이 불어요.",h:"오다",a:["오는 데다가","오는 데다"],en:"It's raining today, and it's very windy too."},
  {q:"그 집은 ___ 교통도 편리해요.",h:"넓다",a:["넓은 데다가","넓은 데다"],en:"That place is spacious, and transport is convenient too."},
  {q:"어제 잠을 못 ___ 일도 많아서 피곤했어요.",h:"자다, past",a:["잔 데다가","잔 데다"],en:"I didn't sleep last night and had lots of work, so I was tired."}]},
{id:"ppeonhada",form:"-(으)ㄹ 뻔하다",meaning:"almost (did something, but didn't)",cat:"Experience & change",
 notes:"Vowel/ㄹ stem + ㄹ 뻔하다; consonant stem + 을 뻔하다. Almost always past: 놓칠 뻔했어요. Often with 하마터면 (\"nearly\").",
 ex:[["늦잠을 자서 비행기를 놓칠 뻔했어요.","I overslept and almost missed my flight."]],
 drills:[
  {q:"늦잠을 자서 비행기를 ___ 했어요.",h:"놓치다",a:["놓칠 뻔"],en:"I overslept and almost missed my flight."},
  {q:"길이 미끄러워서 ___ 했어요.",h:"넘어지다",a:["넘어질 뻔"],en:"The road was slippery and I almost fell."},
  {q:"영화가 너무 슬퍼서 ___ 했어요.",h:"울다",a:["울 뻔"],en:"The movie was so sad I almost cried."},
  {q:"하마터면 차에 ___ 했어요.",h:"부딪히다",a:["부딪힐 뻔"],en:"I nearly got hit by a car."}]},
{id:"beorida",form:"-아/어 버리다",meaning:"(do) completely; ended up (with regret or relief)",cat:"Experience & change",
 notes:"Stem + 아/어 버리다: 먹어 버렸어요, 가 버렸어요. Adds the feeling that something is done and gone — regret (oops) or relief (finally done). 잊어버리다 and 잃어버리다 have become single words.",
 ex:[["케이크를 혼자 다 먹어 버렸어요.","I ended up eating the whole cake by myself."]],
 drills:[
  {q:"케이크를 혼자 다 ___.",h:"먹다 → past polite",a:["먹어 버렸어요"],en:"I went and ate the whole cake by myself."},
  {q:"기다리다가 친구가 먼저 ___.",h:"가다 → past polite",a:["가 버렸어요"],en:"My friend got tired of waiting and just left."},
  {q:"중요한 약속을 ___.",h:"잊다 → past polite",a:["잊어버렸어요","잊어 버렸어요"],en:"I completely forgot an important appointment."},
  {q:"숙제를 빨리 ___ 놀러 가자.",h:"하다 + -고",a:["해 버리고"],en:"Let's get our homework out of the way and go out."}]},
{id:"gomalda",form:"-고 말다",meaning:"end up (doing), despite efforts",cat:"Experience & change",
 notes:"Action stem + 고 말았다: 울고 말았어요, 떨어지고 말았어요. Usually an unwanted outcome after trying to avoid it. Future -고 말겠다 = strong resolve (꼭 합격하고 말겠어요).",
 ex:[["참으려고 했는데 결국 울고 말았어요.","I tried to hold it in, but I ended up crying."]],
 drills:[
  {q:"참으려고 했는데 결국 ___.",h:"울다 → past polite",a:["울고 말았어요"],en:"I tried to hold back, but I ended up crying."},
  {q:"열심히 공부했지만 시험에 ___.",h:"떨어지다 → past polite",a:["떨어지고 말았어요"],en:"I studied hard but ended up failing the exam."},
  {q:"조심했는데 컵을 ___.",h:"깨다 → past polite",a:["깨고 말았어요"],en:"I was careful, but I ended up breaking the cup."},
  {q:"다이어트 중인데 또 라면을 ___.",h:"먹다 → past polite",a:["먹고 말았어요"],en:"I'm on a diet, but I ate ramyeon again."}]},
{id:"gonhada",form:"-곤 하다",meaning:"used to, tend to (repeated habit)",cat:"Experience & change",
 notes:"Action stem + 곤 하다: 놀곤 했어요 (used to play), 먹곤 해요 (I tend to eat). Describes something done repeatedly, often with a nostalgic tone in the past.",
 ex:[["어릴 때 이 공원에서 자주 놀곤 했어요.","I used to play in this park a lot as a kid."]],
 drills:[
  {q:"어릴 때 이 공원에서 자주 ___.",h:"놀다 → past habit",a:["놀곤 했어요"],en:"I used to play in this park a lot as a kid."},
  {q:"대학생 때는 친구들과 등산을 ___.",h:"가다 → past habit",a:["가곤 했어요"],en:"In university I used to go hiking with friends."},
  {q:"스트레스를 받으면 단 걸 ___.",h:"먹다 → present habit",a:["먹곤 해요"],en:"When I'm stressed, I tend to eat sweets."},
  {q:"시험 기간에는 밤새 ___.",h:"공부하다 → past habit",a:["공부하곤 했어요"],en:"During exams I used to study all night."}]},
{id:"cheokhada",form:"-(으)ㄴ/는 척하다",meaning:"pretend to",cat:"Speech style & nuance",
 notes:"Action verbs: present -는 척하다 (자는 척), past -(으)ㄴ 척하다 (본 척). Adjectives: -(으)ㄴ 척하다 (괜찮은 척). ㄹ-stem: 알다 → 아는 척. 체하다 means the same.",
 ex:[["모르면서 아는 척했어요.","I pretended to know even though I didn't."]],
 drills:[
  {q:"모르면서 ___ 했어요.",h:"알다",a:["아는 척"],en:"I pretended to know even though I didn't."},
  {q:"일어나기 싫어서 ___ 했어요.",h:"자다",a:["자는 척"],en:"I didn't want to get up, so I pretended to be asleep."},
  {q:"___ 했지만 사실은 많이 슬펐어요.",h:"괜찮다",a:["괜찮은 척"],en:"I acted like I was fine, but I was actually really sad."},
  {q:"그 사람을 보고도 못 ___ 지나갔어요.",h:"보다, past + 척하고",a:["본 척하고","본 체하고"],en:"I saw him but walked past pretending I hadn't."}]},
{id:"riga",form:"-(으)ㄹ 리가 없다",meaning:"there's no way that…",cat:"Guessing & impressions",
 notes:"Vowel/ㄹ stem + ㄹ 리가 없다; consonant stem + 을 리가 없다; past -았/었을 리가 없다; noun N일 리가 없다. Strong disbelief. As a question: 그럴 리가요? (No way!)",
 ex:[["그 사람이 거짓말을 할 리가 없어요.","There's no way he'd lie."]],
 drills:[
  {q:"그 사람이 거짓말을 ___ 없어요.",h:"하다",a:["할 리가"],en:"There's no way that person would lie."},
  {q:"벌써 ___ 없어요. 10분 전에 출발했어요.",h:"도착하다, past",a:["도착했을 리가"],en:"There's no way he's arrived already. He left ten minutes ago."},
  {q:"이렇게 싼 가방이 ___ 없어요.",h:"진짜이다",a:["진짜일 리가"],en:"There's no way a bag this cheap is genuine."},
  {q:"민수 씨가 그걸 ___ 없어요.",h:"모르다",a:["모를 리가"],en:"There's no way Minsu doesn't know that."}]},
{id:"tende",form:"-(으)ㄹ 텐데",meaning:"since (I expect)…; I'm sure… (so / but…)",cat:"Guessing & impressions",
 notes:"Vowel/ㄹ stem + ㄹ 텐데; consonant stem + 을 텐데. A guess about a situation, followed by advice, a request or a concern: 비가 올 텐데 우산 가져가세요. Ending a sentence with -(으)ㄹ 텐데요 sounds worried.",
 ex:[["비가 올 텐데 우산을 가져가세요.","It'll probably rain, so take an umbrella."]],
 drills:[
  {q:"비가 ___ 우산을 가져가세요.",h:"오다",a:["올 텐데"],en:"It'll probably rain, so take an umbrella."},
  {q:"배가 ___ 이것 좀 드세요.",h:"고프다",a:["고플 텐데"],en:"You must be hungry — have some of this."},
  {q:"많이 ___ 좀 쉬세요.",h:"피곤하다",a:["피곤할 텐데"],en:"You must be really tired, so get some rest."},
  {q:"지금 버스를 타면 ___ 택시를 타세요.",h:"늦다",a:["늦을 텐데"],en:"If you take the bus now you'll be late, so take a taxi."}]},
{id:"deoramyeon",form:"-았/었더라면",meaning:"if (only) … had (counterfactual past)",cat:"Contrast & conditions",
 notes:"Past stem + 더라면, usually followed by -았/었을 거예요 or -(으)ㄹ 텐데 / 좋았을 텐데: 일찍 출발했더라면 기차를 탔을 거예요. Expresses regret or relief about what didn't happen.",
 ex:[["조금만 일찍 출발했더라면 기차를 탔을 거예요.","If I'd left a bit earlier, I'd have caught the train."]],
 drills:[
  {q:"조금만 일찍 ___ 기차를 탔을 거예요.",h:"출발하다",a:["출발했더라면"],en:"If I'd left a little earlier, I'd have caught the train."},
  {q:"그때 더 열심히 ___ 좋았을 텐데.",h:"공부하다",a:["공부했더라면"],en:"If only I'd studied harder back then."},
  {q:"네가 ___ 큰일 날 뻔했어.",h:"없다",a:["없었더라면"],en:"If you hadn't been there, it could have been a disaster."},
  {q:"미리 ___ 자리가 있었을 거예요.",h:"예약하다",a:["예약했더라면"],en:"If we'd booked in advance, there would have been seats."}]},
{id:"gime",form:"-는 김에",meaning:"while (you're) at it, since you're already…",cat:"Time & sequence",
 notes:"Action verbs: -는 김에 (가는 김에); for something already done: -(으)ㄴ 김에 (온 김에). Use the opportunity of one action to do another.",
 ex:[["시장에 가는 김에 과일도 좀 사 오세요.","Since you're going to the market, pick up some fruit too."]],
 drills:[
  {q:"시장에 ___ 과일도 좀 사 오세요.",h:"가다",a:["가는 김에"],en:"While you're at the market, get some fruit too."},
  {q:"방을 ___ 부엌도 청소했어요.",h:"청소하다",a:["청소하는 김에"],en:"While I was cleaning my room, I cleaned the kitchen too."},
  {q:"서울에 ___ 친구도 만났어요.",h:"오다, past",a:["온 김에"],en:"Since I'd come to Seoul, I met a friend too."},
  {q:"말이 ___ 하나 물어볼게요.",h:"나오다, past",a:["나온 김에"],en:"Since we're on the subject, let me ask you something."}]},
{id:"neundaero",form:"-는 대로",meaning:"as soon as; (just) as, in the way that",cat:"Time & sequence",
 notes:"Action stem + 는 대로. \"As soon as\": 도착하는 대로 연락할게요. \"In the same way as\": 제가 하는 대로 하세요 (past: 들은 대로). Noun: N대로 (계획대로 = according to plan).",
 ex:[["집에 도착하는 대로 연락할게요.","I'll get in touch as soon as I get home."]],
 drills:[
  {q:"집에 ___ 연락할게요.",h:"도착하다",a:["도착하는 대로"],en:"I'll contact you as soon as I get home."},
  {q:"결과가 ___ 알려 드릴게요.",h:"나오다",a:["나오는 대로"],en:"I'll let you know as soon as the results are out."},
  {q:"제가 ___ 따라 하세요.",h:"하다",a:["하는 대로"],en:"Do it the way I do."},
  {q:"___ 자유롭게 써 보세요.",h:"생각나다",a:["생각나는 대로"],en:"Write freely, whatever comes to mind."}]},
{id:"eulmanhada",form:"-(으)ㄹ 만하다",meaning:"worth doing; (just about) manageable",cat:"Guessing & impressions",
 notes:"Vowel/ㄹ stem + ㄹ 만하다 (볼 만해요, 살 만해요); consonant stem + 을 만하다 (먹을 만해요). Recommends something (worth seeing), or says it's bearable (살 만해요 = life's okay).",
 ex:[["이 영화 정말 볼 만해요.","This movie is really worth watching."]],
 drills:[
  {q:"이 영화 정말 ___ 해요.",h:"보다",a:["볼 만"],en:"This movie is really worth watching."},
  {q:"경주는 한번 가 ___ 곳이에요.",h:"보다",a:["볼 만한"],en:"Gyeongju is a place worth visiting once."},
  {q:"이 책은 ___ 해요.",h:"읽다",a:["읽을 만"],en:"This book is worth reading."},
  {q:"처음엔 힘들었는데 이제 ___ 해요.",h:"살다",a:["살 만"],en:"It was hard at first, but now life is manageable."}]},
{id:"dorado",form:"-더라도",meaning:"even if (hypothetical, stronger than -아/어도)",cat:"Contrast & conditions",
 notes:"Stem + 더라도: 힘들더라도, 비가 오더라도. Assumes an unlikely or unwanted situation and insists the result still holds. Often with 아무리 / 비록.",
 ex:[["힘들더라도 포기하지 마세요.","Even if it's hard, don't give up."]],
 drills:[
  {q:"___ 포기하지 마세요.",h:"힘들다",a:["힘들더라도"],en:"Even if it's hard, don't give up."},
  {q:"비가 ___ 행사는 예정대로 진행합니다.",h:"오다",a:["오더라도"],en:"Even if it rains, the event will go ahead as planned."},
  {q:"조금 ___ 꼭 오세요.",h:"늦다",a:["늦더라도"],en:"Even if you're a bit late, please come."},
  {q:"이번에 ___ 다시 도전할 거예요.",h:"실패하다",a:["실패하더라도"],en:"Even if I fail this time, I'll try again."}]},
{id:"banmyeon",form:"-(으)ㄴ/는 반면(에)",meaning:"whereas, on the other hand",cat:"Contrast & conditions",
 notes:"Action verbs and 있다/없다: -는 반면 (잘하는 반면). Adjectives: -(으)ㄴ 반면 (조용한 반면). Contrasts two sides of one thing or two things — more formal than -지만.",
 ex:[["형은 조용한 반면에 동생은 활발해요.","The older brother is quiet, whereas the younger one is outgoing."]],
 drills:[
  {q:"형은 ___ 동생은 활발해요.",h:"조용하다",a:["조용한 반면에","조용한 반면"],en:"The older brother is quiet, while the younger one is outgoing."},
  {q:"이 일은 월급이 ___ 시간이 많이 들어요.",h:"많다",a:["많은 반면에","많은 반면"],en:"This job pays well, but it takes a lot of time."},
  {q:"서울은 교통이 ___ 집값이 비싸요.",h:"편리하다",a:["편리한 반면에","편리한 반면"],en:"Seoul has convenient transport, whereas housing is expensive."},
  {q:"저는 수학은 ___ 언어는 약해요.",h:"잘하다",a:["잘하는 반면에","잘하는 반면"],en:"I'm good at math, but weak at languages."}]},
// ---------- TOPIK 5 ----------
{id:"gimaryeon",form:"-기 마련이다",meaning:"is bound to, naturally (it's only natural that…)",cat:"Guessing & impressions",
 notes:"Stem + 기 마련이다: 실수하기 마련이에요. States a general truth or natural tendency. Also -게 마련이다.",
 ex:[["누구나 실수를 하기 마련이에요.","Everyone is bound to make mistakes."]],
 drills:[
  {q:"누구나 실수를 ___.",h:"하다",a:["하기 마련이에요","하게 마련이에요"],en:"Everyone is bound to make mistakes."},
  {q:"시간이 지나면 다 ___.",h:"잊다",a:["잊기 마련이에요","잊게 마련이에요","잊혀지기 마련이에요"],en:"Over time, you naturally forget everything."},
  {q:"노력하면 좋은 결과가 ___.",h:"나오다",a:["나오기 마련이에요","나오게 마련이에요"],en:"If you put in the effort, good results naturally follow."},
  {q:"처음에는 누구나 ___.",h:"긴장하다",a:["긴장하기 마련이에요","긴장하게 마련이에요"],en:"Everyone gets nervous at first."}]},
{id:"semida",form:"-(으)ㄴ/는 셈이다",meaning:"it amounts to, it's practically",cat:"Guessing & impressions",
 notes:"Action verbs: present -는 셈이다, past -(으)ㄴ 셈이다. Adjectives: -(으)ㄴ 셈이다. Noun: N인 셈이다. Draws a conclusion by rough calculation or comparison.",
 ex:[["일주일에 6일 일하니까 거의 매일 일하는 셈이에요.","I work six days a week, so I practically work every day."]],
 drills:[
  {q:"일주일에 6일 일하니까 거의 매일 ___.",h:"일하다",a:["일하는 셈이에요"],en:"I work six days a week, so it's practically every day."},
  {q:"10문제 중에 9개를 맞았으니까 거의 다 ___.",h:"맞다, past",a:["맞은 셈이에요"],en:"I got 9 out of 10, so I basically got them all."},
  {q:"반값에 샀으니까 싸게 ___.",h:"사다, past",a:["산 셈이에요"],en:"I bought it at half price, so I got it cheap."},
  {q:"한국에서 10년 살았으니까 한국이 제2의 ___.",h:"고향이다",a:["고향인 셈이에요"],en:"I lived in Korea for ten years, so it's practically my second home."}]},
{id:"gineunkkeonyeong",form:"-기는커녕",meaning:"far from…, let alone…",cat:"Contrast & conditions",
 notes:"Stem + 기는커녕: 받기는커녕. Noun: N은/는커녕 (칭찬은커녕). The opposite (or something even worse) happened. Often followed by 오히려 or -도 못 하다.",
 ex:[["칭찬을 받기는커녕 혼만 났어요.","Far from being praised, I just got scolded."]],
 drills:[
  {q:"칭찬을 ___ 혼만 났어요.",h:"받다",a:["받기는커녕"],en:"Far from getting praise, I got scolded."},
  {q:"돈을 ___ 빚만 늘었어요.",h:"모으다",a:["모으기는커녕"],en:"Far from saving money, my debt just grew."},
  {q:"주말에 ___ 일만 했어요.",h:"쉬다",a:["쉬기는커녕"],en:"Far from resting on the weekend, I did nothing but work."},
  {q:"살이 ___ 오히려 쪘어요.",h:"빠지다",a:["빠지기는커녕"],en:"Far from losing weight, I actually gained."}]},
{id:"eunnameoji",form:"-(으)ㄴ 나머지",meaning:"so (much) that, as a result of being too…",cat:"Reasons & causes",
 notes:"Past/adjective modifier -(으)ㄴ + 나머지: 긴장한 나머지, 기쁜 나머지. An extreme state leads to a (usually unintended) result.",
 ex:[["너무 긴장한 나머지 아무 말도 못 했어요.","I was so nervous that I couldn't say anything."]],
 drills:[
  {q:"너무 ___ 아무 말도 못 했어요.",h:"긴장하다",a:["긴장한 나머지"],en:"I was so nervous I couldn't say a word."},
  {q:"합격 소식에 너무 ___ 눈물이 났어요.",h:"기쁘다",a:["기쁜 나머지"],en:"I was so happy about passing that I cried."},
  {q:"급하게 ___ 지갑을 두고 왔어요.",h:"서두르다",a:["서두른 나머지"],en:"I was in such a hurry that I left my wallet behind."},
  {q:"일에 ___ 식사도 거르고 있어요.",h:"몰두하다",a:["몰두한 나머지"],en:"He's so absorbed in work that he's skipping meals."}]},
{id:"tase",form:"-(으)ㄴ/는 탓에",meaning:"because of (blaming a cause for a bad result)",cat:"Reasons & causes",
 notes:"Action verbs: past -(으)ㄴ 탓에, present -는 탓에. Adjectives: -(으)ㄴ 탓에. Noun: N 탓에 / N 탓이다. Negative result, often blaming. Compare 덕분에 (positive).",
 ex:[["비가 많이 온 탓에 경기가 취소됐어요.","The game was canceled because of the heavy rain."]],
 drills:[
  {q:"비가 많이 ___ 경기가 취소됐어요.",h:"오다, past",a:["온 탓에"],en:"The game was canceled because of the heavy rain."},
  {q:"어제 늦게 ___ 오늘 너무 피곤해요.",h:"자다, past",a:["잔 탓에"],en:"I'm exhausted today because I went to bed late."},
  {q:"준비가 ___ 발표를 망쳤어요.",h:"부족하다",a:["부족한 탓에"],en:"I botched the presentation because I wasn't prepared enough."},
  {q:"길이 많이 ___ 회의에 늦었어요.",h:"막히다, past",a:["막힌 탓에"],en:"I was late for the meeting because traffic was terrible."}]},
{id:"dasipi",form:"-다시피",meaning:"as (you know / see / I said); practically (-다시피 하다)",cat:"Speech style & nuance",
 notes:"With perception/speech verbs: 아시다시피 (as you know), 보시다시피 (as you can see), 말씀드렸다시피 (as I mentioned). With 하다: 살다시피 하다 = practically live (somewhere).",
 ex:[["아시다시피 저는 한국어를 잘 못해요.","As you know, I'm not very good at Korean."]],
 drills:[
  {q:"___ 저는 한국어를 잘 못해요.",h:"알다 (honorific)",a:["아시다시피"],en:"As you know, I'm not great at Korean."},
  {q:"___ 지금 좀 바빠요.",h:"보다 (honorific)",a:["보시다시피"],en:"As you can see, I'm a bit busy right now."},
  {q:"지난번에 ___ 회의는 내일이에요.",h:"말씀드리다, past",a:["말씀드렸다시피"],en:"As I mentioned last time, the meeting is tomorrow."},
  {q:"시험 때문에 요즘 도서관에서 ___ 해요.",h:"살다",a:["살다시피"],en:"Because of exams, I practically live in the library."}]},
{id:"ppunmananira",form:"-(으)ㄹ 뿐만 아니라",meaning:"not only … but also",cat:"Contrast & conditions",
 notes:"Vowel/ㄹ stem + ㄹ 뿐만 아니라; consonant stem + 을 뿐만 아니라; past -았/었을 뿐만 아니라. Noun: N뿐만 아니라. Usually followed by 도 in the second part.",
 ex:[["이 식당은 맛있을 뿐만 아니라 분위기도 좋아요.","This restaurant is not only tasty but also has a nice atmosphere."]],
 drills:[
  {q:"이 식당은 ___ 분위기도 좋아요.",h:"맛있다",a:["맛있을 뿐만 아니라"],en:"This restaurant isn't just tasty, the atmosphere is nice too."},
  {q:"그는 한국어를 ___ 중국어도 잘해요.",h:"잘하다",a:["잘할 뿐만 아니라"],en:"He's not only good at Korean but also at Chinese."},
  {q:"이 일은 ___ 보람도 있어요.",h:"재미있다",a:["재미있을 뿐만 아니라"],en:"This work isn't just interesting, it's rewarding too."},
  {q:"어제는 비가 ___ 바람도 많이 불었어요.",h:"오다, past",a:["왔을 뿐만 아니라"],en:"Yesterday it not only rained but was very windy too."}]},
{id:"neunhan",form:"-는 한",meaning:"as long as, unless (with negative)",cat:"Contrast & conditions",
 notes:"Stem + 는 한 (있다/없다 too): 포기하지 않는 한, 특별한 일이 없는 한. States a condition under which something stays true.",
 ex:[["포기하지 않는 한 기회는 있어요.","As long as you don't give up, there's a chance."]],
 drills:[
  {q:"포기하지 ___ 기회는 있어요.",h:"않다",a:["않는 한"],en:"As long as you don't give up, there's a chance."},
  {q:"특별한 일이 ___ 꼭 참석할게요.",h:"없다",a:["없는 한"],en:"Unless something comes up, I'll definitely attend."},
  {q:"건강이 ___ 계속 일하고 싶어요.",h:"허락하다",a:["허락하는 한"],en:"As long as my health allows, I want to keep working."},
  {q:"제가 이 회사에 ___ 그런 일은 없을 거예요.",h:"있다",a:["있는 한"],en:"As long as I'm at this company, that won't happen."}]},
{id:"beophada",form:"-(으)ㄹ 법하다",meaning:"it's likely / understandable that",cat:"Guessing & impressions",
 notes:"Vowel/ㄹ stem + ㄹ 법하다; consonant stem + 을 법하다. Often -(으)ㄹ 법도 하다 (\"it would make sense if…\") or as a modifier -(으)ㄹ 법한.",
 ex:[["그런 상황이라면 화가 날 법도 해요.","In that situation, it's understandable to get angry."]],
 drills:[
  {q:"그런 상황이라면 화가 ___ 해요.",h:"나다",a:["날 법도","날 법"],en:"In that situation, it would make sense to get angry."},
  {q:"누구나 한 번쯤 ___ 실수예요.",h:"하다",a:["할 법한"],en:"It's a mistake anyone might make at some point."},
  {q:"그 정도면 ___ 한데 아직도 모르네요.",h:"알다",a:["알 법도","알 법"],en:"By now he should know, but he still doesn't."},
  {q:"그 사람이라면 그런 말을 ___ 해요.",h:"하다",a:["할 법도","할 법"],en:"That's just the sort of thing he'd say."}]},
{id:"sipsang",form:"-기 십상이다",meaning:"it's easy to (end up doing something bad)",cat:"Guessing & impressions",
 notes:"Action stem + 기 십상이다: 실수하기 십상이에요. Warns that a negative result is very likely.",
 ex:[["서두르면 실수하기 십상이에요.","If you rush, you'll easily make mistakes."]],
 drills:[
  {q:"서두르면 ___.",h:"실수하다",a:["실수하기 십상이에요"],en:"If you rush, you're likely to make mistakes."},
  {q:"밤늦게 먹으면 살이 ___.",h:"찌다",a:["찌기 십상이에요"],en:"If you eat late at night, you'll easily gain weight."},
  {q:"준비 없이 산에 가면 ___.",h:"고생하다",a:["고생하기 십상이에요"],en:"Go to the mountains unprepared and you're asking for trouble."},
  {q:"이렇게 계획 없이 하면 ___.",h:"실패하다",a:["실패하기 십상이에요"],en:"Doing it without a plan like this, you're likely to fail."}]},
{id:"eulgyeom",form:"-(으)ㄹ 겸",meaning:"also for the purpose of (two aims at once)",cat:"Plans & intentions",
 notes:"Vowel/ㄹ stem + ㄹ 겸; consonant stem + 을 겸. Often doubled: 운동도 할 겸 바람도 쐴 겸. Noun: N 겸 N (아침 겸 점심 = brunch).",
 ex:[["운동도 할 겸 걸어서 출근해요.","I walk to work, partly for the exercise."]],
 drills:[
  {q:"운동도 ___ 걸어서 출근해요.",h:"하다",a:["할 겸"],en:"I walk to work, partly to get some exercise."},
  {q:"친구도 ___ 서울에 갔어요.",h:"만나다",a:["만날 겸"],en:"I went to Seoul, partly to see a friend."},
  {q:"바람도 ___ 잠깐 밖에 나갔어요.",h:"쐬다",a:["쐴 겸"],en:"I stepped outside for a bit, partly to get some air."},
  {q:"구경도 ___ 시장에 들렀어요.",h:"하다",a:["할 겸"],en:"I stopped by the market, partly to look around."}]},
{id:"jeongdoro",form:"-(으)ㄹ 정도로",meaning:"to the extent that, so … that",cat:"Building sentences",
 notes:"Vowel/ㄹ stem + ㄹ 정도로; consonant stem + 을 정도로. Describes degree by its effect: 눈물이 날 정도로 웃었어요. Also as a modifier: -(으)ㄹ 정도이다.",
 ex:[["눈물이 날 정도로 웃었어요.","I laughed so hard I cried."]],
 drills:[
  {q:"눈물이 ___ 웃었어요.",h:"나다",a:["날 정도로"],en:"I laughed so hard I cried."},
  {q:"말이 안 ___ 피곤해요.",h:"나오다",a:["나올 정도로"],en:"I'm so tired I can't even speak."},
  {q:"믿을 수 ___ 맛있었어요.",h:"없다",a:["없을 정도로"],en:"It was unbelievably delicious."},
  {q:"앞이 안 ___ 비가 많이 왔어요.",h:"보이다",a:["보일 정도로"],en:"It rained so hard you couldn't see ahead."}]},
{id:"tong",form:"-는 통에",meaning:"because of (a chaotic or disruptive situation)",cat:"Reasons & causes",
 notes:"Action stem + 는 통에: 떠드는 통에, 우는 통에. The cause is noisy, hectic or disturbing, and the result is negative. Mostly spoken.",
 ex:[["옆집에서 떠드는 통에 잠을 못 잤어요.","I couldn't sleep because of the racket next door."]],
 drills:[
  {q:"옆집에서 ___ 잠을 못 잤어요.",h:"떠들다",a:["떠드는 통에"],en:"I couldn't sleep because of the noise next door."},
  {q:"아기가 계속 ___ 일을 못 했어요.",h:"울다",a:["우는 통에"],en:"I couldn't work because the baby kept crying."},
  {q:"손님이 갑자기 ___ 정신이 없었어요.",h:"몰리다",a:["몰리는 통에"],en:"Customers suddenly flooded in, and it was chaos."},
  {q:"사람들이 뒤에서 ___ 넘어질 뻔했어요.",h:"밀다",a:["미는 통에"],en:"People were pushing from behind and I nearly fell."}]},
// ---------- TOPIK 6 ----------
{id:"mangjeong",form:"-(으)ㄹ망정",meaning:"even if (I have to…), (I'd rather…)",cat:"Contrast & conditions",
 notes:"Vowel/ㄹ stem + ㄹ망정; consonant stem + 을망정. Accepts a bad situation to insist on something more important: 굶을망정 도움은 안 받겠어요. Formal/literary.",
 ex:[["굶을망정 남의 돈은 받지 않겠어요.","I'd go hungry before I'd take someone else's money."]],
 drills:[
  {q:"___ 남의 돈은 받지 않겠어요.",h:"굶다",a:["굶을망정"],en:"I'd rather go hungry than take other people's money."},
  {q:"___ 비굴하게 살고 싶지는 않아요.",h:"가난하다",a:["가난할망정"],en:"I may be poor, but I won't live without dignity."},
  {q:"___ 최선을 다할 거예요.",h:"실패하다",a:["실패할망정"],en:"Even if I fail, I'll give it my all."},
  {q:"월급은 ___ 일은 즐거워요.",h:"적다",a:["적을망정"],en:"The pay may be low, but the work is enjoyable."}]},
{id:"geonman",form:"-건만",meaning:"although, even though (literary)",cat:"Contrast & conditions",
 notes:"Stem + 건만, usually past: 노력했건만. A written equivalent of -지만 with a tone of disappointment. Often in narrative -다 style.",
 ex:[["열심히 노력했건만 결과가 좋지 않았다.","Despite all my effort, the result wasn't good."]],
 drills:[
  {q:"열심히 ___ 결과가 좋지 않았다.",h:"노력하다, past",a:["노력했건만"],en:"I tried so hard, yet the result wasn't good."},
  {q:"그렇게 여러 번 ___ 그는 듣지 않았다.",h:"말하다, past",a:["말했건만"],en:"I told him so many times, but he didn't listen."},
  {q:"봄이 ___ 아직 날씨가 춥다.",h:"오다, past",a:["왔건만"],en:"Spring has come, yet it's still cold."},
  {q:"밤새 ___ 그는 끝내 오지 않았다.",h:"기다리다, past",a:["기다렸건만"],en:"I waited all night, but he never came."}]},
{id:"jieonjeong",form:"-(으)ㄹ지언정",meaning:"even if…, (never) — strong refusal",cat:"Contrast & conditions",
 notes:"Vowel/ㄹ stem + ㄹ지언정; consonant stem + 을지언정. Like -(으)ㄹ망정: accepts the worst case while flatly refusing the alternative. Formal, emphatic.",
 ex:[["손해를 볼지언정 거짓말은 하지 않겠어요.","Even if I lose out, I won't lie."]],
 drills:[
  {q:"손해를 ___ 거짓말은 하지 않겠어요.",h:"보다",a:["볼지언정"],en:"Even if I take a loss, I won't lie."},
  {q:"___ 포기하지는 않겠습니다.",h:"쓰러지다",a:["쓰러질지언정"],en:"I may collapse, but I will not give up."},
  {q:"조금 ___ 대충 하고 싶지 않아요.",h:"늦다",a:["늦을지언정"],en:"Even if it's a bit late, I don't want to do it sloppily."},
  {q:"차라리 혼자 ___ 그 사람과는 일하지 않겠어요.",h:"하다",a:["할지언정"],en:"I'd rather do it alone than work with him."}]},
{id:"goja",form:"-고자",meaning:"in order to, intending to (formal)",cat:"Plans & intentions",
 notes:"Action stem + 고자: 해결하고자, 드리고자 합니다. Formal speeches, reports and writing. -고자 하다 = intend to.",
 ex:[["여러분께 감사의 말씀을 드리고자 합니다.","I would like to express my gratitude to you all."]],
 drills:[
  {q:"여러분께 감사의 말씀을 ___ 합니다.",h:"드리다",a:["드리고자"],en:"I would like to express my thanks to you all."},
  {q:"문제를 ___ 회의를 열었습니다.",h:"해결하다",a:["해결하고자"],en:"We held a meeting in order to resolve the issue."},
  {q:"더 나은 서비스를 ___ 노력하겠습니다.",h:"제공하다",a:["제공하고자"],en:"We will strive to provide better service."},
  {q:"본 연구는 그 원인을 ___ 한다.",h:"밝히다",a:["밝히고자"],en:"This study aims to identify the cause."}]},
{id:"eumeuro",form:"-(으)므로",meaning:"because, since (formal written)",cat:"Reasons & causes",
 notes:"Vowel/ㄹ stem + 므로; consonant stem + 으므로; noun N(이)므로; past -았/었으므로. Notices, reports, academic writing. Don't confuse with -(으)ㅁ으로(써) = \"by doing\".",
 ex:[["비가 오므로 행사를 취소합니다.","As it is raining, the event is canceled."]],
 drills:[
  {q:"비가 ___ 행사를 취소합니다.",h:"오다",a:["오므로"],en:"Due to rain, the event is canceled."},
  {q:"현재 공사 ___ 출입을 금지합니다.",h:"중이다",a:["중이므로"],en:"Entry is prohibited as construction is in progress."},
  {q:"자료가 ___ 추가 조사가 필요하다.",h:"부족하다",a:["부족하므로"],en:"As data is insufficient, further research is needed."},
  {q:"마감 기한이 ___ 서둘러 주시기 바랍니다.",h:"지나다, past",a:["지났으므로"],en:"As the deadline has passed, please hurry."}]},
{id:"ttareum",form:"-(으)ㄹ 따름이다",meaning:"merely, only (humble or emphatic)",cat:"Speech style & nuance",
 notes:"Vowel/ㄹ stem + ㄹ 따름이다; consonant stem + 을 따름이다; past -았/었을 따름이다. Humble (제 일을 했을 따름입니다) or emphasises a single feeling (감사할 따름입니다). Formal; similar to -(으)ㄹ 뿐이다.",
 ex:[["저는 제 일을 했을 따름입니다.","I was merely doing my job."]],
 drills:[
  {q:"저는 제 일을 ___ 따름입니다.",h:"하다, past",a:["했을"],en:"I was merely doing my job."},
  {q:"도와주셔서 그저 ___ 따름입니다.",h:"감사하다",a:["감사할"],en:"I'm simply grateful for your help."},
  {q:"결과가 이렇게 되어서 ___ 따름이에요.",h:"안타깝다",a:["안타까울"],en:"I can only say it's a shame things turned out this way."},
  {q:"그분의 실력은 그저 ___ 따름이에요.",h:"놀랍다",a:["놀라울"],en:"Her skill is simply astonishing."}]},
{id:"geujieopda",form:"-기 그지없다",meaning:"extremely, beyond words",cat:"Speech style & nuance",
 notes:"Adjective stem + 기 그지없다: 기쁘기 그지없어요, 아름답기 그지없다. Literary intensifier for feelings and impressions.",
 ex:[["다시 만나게 되어 기쁘기 그지없습니다.","I am overjoyed to meet you again."]],
 drills:[
  {q:"다시 만나게 되어 ___.",h:"기쁘다",a:["기쁘기 그지없습니다","기쁘기 그지없어요"],en:"I'm overjoyed to see you again."},
  {q:"그의 태도는 ___.",h:"무례하다, past (plain)",a:["무례하기 그지없었다"],en:"His attitude was extremely rude."},
  {q:"정상에서 본 경치는 ___.",h:"아름답다, past (plain)",a:["아름답기 그지없었다"],en:"The view from the summit was beautiful beyond words."},
  {q:"혼자 남겨진 그는 ___.",h:"외롭다, past (plain)",a:["외롭기 그지없었다"],en:"Left alone, he was utterly lonely."}]},
{id:"madang",form:"-는/(으)ㄴ 마당에",meaning:"in a situation where, now that (things have come to this)",cat:"Reasons & causes",
 notes:"Action verbs: -는 마당에 (present), -(으)ㄴ 마당에 (past). Adjectives: -(으)ㄴ 마당에. Points to a (usually difficult) situation that makes something unreasonable or pointless.",
 ex:[["여기까지 온 마당에 포기할 수는 없어요.","Having come this far, I can't give up now."]],
 drills:[
  {q:"여기까지 ___ 포기할 수는 없어요.",h:"오다, past",a:["온 마당에"],en:"Having come this far, I can't give up."},
  {q:"이미 다 ___ 후회해도 소용없어요.",h:"끝나다, past",a:["끝난 마당에"],en:"Now that it's all over, regretting it is pointless."},
  {q:"회사가 이렇게 ___ 월급을 올려 달라고 할 수 없어요.",h:"어렵다",a:["어려운 마당에"],en:"With the company struggling like this, I can't ask for a raise."},
  {q:"다들 ___ 혼자 놀 수는 없잖아요.",h:"바쁘다",a:["바쁜 마당에"],en:"With everyone so busy, I can't just slack off."}]},
{id:"geoniwa",form:"-거니와",meaning:"not only…, and besides (literary)",cat:"Contrast & conditions",
 notes:"Stem + 거니와; past -았/었거니와. Adds a second point in the same direction. Formal writing; in speech, -(으)ㄹ 뿐만 아니라 or -고 is more natural.",
 ex:[["그는 똑똑하거니와 성격도 좋다.","He's not only smart, his personality is good too."]],
 drills:[
  {q:"그는 ___ 성격도 좋다.",h:"똑똑하다",a:["똑똑하거니와"],en:"He's smart, and on top of that has a good personality."},
  {q:"이 제품은 값도 ___ 품질도 좋다.",h:"싸다",a:["싸거니와"],en:"This product is not only cheap but also high quality."},
  {q:"지금은 시간도 ___ 돈도 없다.",h:"없다",a:["없거니와"],en:"Right now I have neither time nor money."},
  {q:"그날은 날씨도 ___ 경치도 아름다웠다.",h:"좋다, past",a:["좋았거니와"],en:"That day the weather was good, and the scenery was beautiful too."}]},
{id:"eundeul",form:"-(으)ㄴ들",meaning:"even if… (what's the use?) — rhetorical",cat:"Contrast & conditions",
 notes:"Vowel/ㄹ stem + ㄴ들 (후회한들, 운들); consonant stem + 은들 (많은들). Followed by a rhetorical question or a statement that it makes no difference: 지금 후회한들 무슨 소용이 있겠어요?",
 ex:[["지금 후회한들 무슨 소용이 있겠어요?","What's the use of regretting it now?"]],
 drills:[
  {q:"지금 ___ 무슨 소용이 있겠어요?",h:"후회하다",a:["후회한들"],en:"What good would regretting it do now?"},
  {q:"아무리 ___ 그 사람이 듣겠어요?",h:"말하다",a:["말한들"],en:"No matter what you say, do you think he'll listen?"},
  {q:"이제 와서 울어 ___ 달라지는 건 없어요.",h:"보다",a:["본들"],en:"Crying about it now won't change anything."},
  {q:"돈이 아무리 ___ 건강을 잃으면 무슨 소용이에요?",h:"많다",a:["많은들"],en:"However much money you have, what's the point if you lose your health?"}]}
];
GRAMMAR.push(...GNEW);

// TOPIK level for every grammar point (approximate, following common textbook progression)
const GLEVEL={
 1:["ayo","past","anmot","go","euseyo","eupsida","goitda","eulgeoyeyo","gosipda","eureo","eulkkayo","sudo","ajuda","jimalda","jiman","eeseo","euro","doman","compare"],
 2:["aseo","eunikka","gittaemune","eumyeon","aya","ado","myeonandoe","gijeone","eunhue","eulttae","aboda","jeogi","geona","neunde","eulgeyo","euryeogo","neundongan","myeonseo","gonaseo","modifiers","honorific","neyo","jiyo","eulgeotgatda","neungeotgatda","girohada","gedoeda","ajida","gisijak","eullaeyo","jianhado","euljulalda","aboida","get"],
 3:["jamaja","eunji","aitda","ryeogohada","daga","pyeonida","ado2","neunji","nominal","dago","nyago","rago","jago","deokbune","euljido","nabo","janayo","giwihaeseo","dorok","neurago","deoragoyo","daesin"],
 4:["barame","neundedo","eulsurok","gineun","deon","ndedaga","ppeonhada","beorida","gomalda","gonhada","cheokhada","riga","tende","deoramyeon","gime","neundaero","eulmanhada","dorado","banmyeon"],
 5:["gimaryeon","semida","gineunkkeonyeong","eunnameoji","tase","dasipi","ppunmananira","neunhan","beophada","sipsang","eulgyeom","jeongdoro","tong"],
 6:["mangjeong","geonman","jieonjeong","goja","eumeuro","ttareum","geujieopda","madang","geoniwa","eundeul"]
};
if(!GCATS.includes("Sentence basics"))GCATS.unshift("Sentence basics");
(function(){
  const lv={};for(const k in GLEVEL)for(const id of GLEVEL[k])lv[id]=+k;
  GRAMMAR.forEach((g,i)=>{g.lv=lv[g.id]||3;if(!g.cat)g.cat=(GMETA[g.id]||[0,"Building sentences"])[1];if(g.ord===undefined)g.ord=1000+i;});
  GRAMMAR.sort((a,b)=>a.lv-b.lv||a.ord-b.ord);
})();

</script>
<script>
"use strict";
const APP_VERSION="1.2.0";
// ---------- utilities ----------
const $=s=>document.querySelector(s);
const view=()=>$("#view");
const DAY=864e5;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").normalize("NFC").replace(/[\s.,!?~。…'"“”‘’()]/g,"");
function dayKey(t){const d=t?new Date(t):new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function startOfDay(t){const d=new Date(t);d.setHours(0,0,0,0);return d.getTime();}
function endOfToday(){const d=new Date();d.setHours(23,59,59,999);return d.getTime();}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove("on"),1800);}
const SPK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>';

// ---------- state ----------
const LS_KEY="yeonseup.v1";
function defaultState(){return{v:1,settings:{newVocab:10,newGrammar:1,production:true,level:3},cards:{},seenG:{},custom:[],log:{},mistakes:[],writes:[],updatedAt:0};}
function hydrate(x){const d=defaultState();if(!x||typeof x!=="object")return d;const o=Object.assign(d,x);o.settings=Object.assign(defaultState().settings,x.settings||{});return o;}
let S=defaultState();
try{const r=localStorage.getItem(LS_KEY);if(r)S=hydrate(JSON.parse(r));}catch(e){}
function save(){S.updatedAt=Date.now();try{localStorage.setItem(LS_KEY,JSON.stringify(S));}catch(e){}scheduleRemote();}
function logToday(){const k=dayKey();return S.log[k]||(S.log[k]={rev:0,ok:0,newV:0,newG:0});}
function customVocab(){return (S.custom||[]).map(w=>[w[0],w[1],w[2]||"",w[3]||"",0]);}
function allVocab(){return VOCAB.concat(customVocab());}
const LV=["My words","TOPIK 1","TOPIK 2","TOPIK 3","TOPIK 4","TOPIK 5","TOPIK 6"];
function levelOf(id){const [k,key]=id.split("|");if(k==="v"){const w=vocabByKo(key);return w?w[4]:-1;}const g=G[key];return g?g.lv:-1;}
function levelStats(l){const ws=allVocab().filter(w=>w[4]===l),gs=GRAMMAR.filter(g=>g.lv===l);
  return{words:ws.length,wordsStarted:ws.filter(w=>S.cards["v|"+w[0]+"|r"]).length,gram:gs.length,gramSeen:gs.filter(g=>S.seenG[g.id]).length};}
function vocabByKo(ko){return allVocab().find(w=>w[0]===ko);}
const G=Object.fromEntries(GRAMMAR.map(g=>[g.id,g]));

// ---------- standalone: no cloud sync ----------
const REMOTE=null;
function scheduleRemote(){}
function setSync(cls,txt){const el=$("#sync");el.className="sync "+cls;el.querySelector("span").textContent=txt;}
function updateOnline(){navigator.onLine?setSync("ok","online"):setSync("","offline");}
window.addEventListener("online",updateOnline);window.addEventListener("offline",updateOnline);updateOnline();

// ---------- audio: the phone's built-in Korean voice ----------
let KO_VOICE=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();KO_VOICE=vs.find(v=>/^ko/i.test(v.lang)&&/premium|enhanced|yuna|google/i.test(v.name))||vs.find(v=>/^ko/i.test(v.lang))||null;}catch(e){}}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function speak(t){try{const u=new SpeechSynthesisUtterance(t);u.lang="ko-KR";if(KO_VOICE)u.voice=KO_VOICE;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}}
const canSpeak=()=>("speechSynthesis" in window);
function spkBtn(text){return canSpeak()?`<button class="icon" data-say="${esc(text)}" aria-label="Listen">${SPK}</button>`:"";}

// ---------- Claude feedback via your own API key (stored only on this device) ----------
const KEY_LS="yeonseup.apikey";
function apiKey(){try{return localStorage.getItem(KEY_LS)||"";}catch(e){return"";}}
let SAMPLE=apiKey()?true:null;
async function ask(prompt){
  const key=apiKey();if(!key)throw{code:"not_granted"};
  if(!navigator.onLine)throw{code:"offline"};
  const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"content-type":"application/json","x-api-key":key,"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
    body:JSON.stringify({model:"claude-sonnet-5-5",max_tokens:1200,messages:[{role:"user",content:prompt}]})});
  if(res.status===401)throw{code:"bad_key"};
  if(res.status===429)throw{code:"rate_limited"};
  if(!res.ok)throw{code:"http",message:res.status};
  const j=await res.json();
  const t=(j.content||[]).map(c=>c.text||"").join("");
  const m=t.match(/\{[\s\S]*\}/);
  if(!m)throw{code:"parse",message:t};
  return JSON.parse(m[0]);
}
function errText(e){return e&&e.code==="offline"?"You're offline — Claude feedback needs internet.":e&&e.code==="bad_key"?"Your API key was rejected. Check it under Progress → Claude feedback.":e&&e.code==="rate_limited"?"Too many requests — try again in a minute.":"Couldn't reach Claude right now.";}

// ---------- spaced repetition ----------
// g: 0 again, 1 hard, 2 good, 3 easy
function schedule(id,g){
  const now=Date.now();
  const c=S.cards[id]||{ivl:0,ease:2.5,reps:0,lapses:0,due:now};
  if(g===0){if(c.reps>0)c.lapses++;c.reps=0;c.ivl=0;c.ease=Math.max(1.3,c.ease-.2);c.due=now+5*60e3;}
  else{
    let ivl;
    if(c.reps===0)ivl=g===3?4:1;
    else if(c.reps===1)ivl=g===1?2:g===2?3:6;
    else ivl=g===1?c.ivl*1.2:g===2?c.ivl*c.ease:c.ivl*c.ease*1.3;
    if(g===1)c.ease=Math.max(1.3,c.ease-.15);
    if(g===3)c.ease=Math.min(3.2,c.ease+.15);
    c.ivl=Math.max(1,Math.round(ivl));c.reps++;
    c.due=startOfDay(now)+c.ivl*DAY+4*3600e3;
  }
  S.cards[id]=c;
  return c;
}
function preview(id,g){const keep=S.cards[id]?{...S.cards[id]}:null;const c=schedule(id,g);const out=g===0?"5m":c.ivl+"d";if(keep)S.cards[id]=keep;else delete S.cards[id];return out;}
function dueIds(prefix){const end=endOfToday();return Object.keys(S.cards).filter(id=>id.startsWith(prefix)&&S.cards[id].due<=end).sort((a,b)=>S.cards[a].due-S.cards[b].due);}
function newVocabAvailable(){
  const L=logToday();let quota=Math.max(0,S.settings.newVocab-L.newV);const out=[];
  const pool=customVocab().concat(VOCAB.filter(w=>w[4]===S.settings.level));
  for(const w of pool){if(quota<=0)break;if(!S.cards["v|"+w[0]+"|r"]){out.push("v|"+w[0]+"|r");quota--;}}
  return out;
}
function nextGrammarPoint(){return GRAMMAR.find(g=>!S.seenG[g.id]&&g.lv===S.settings.level);}
function grammarNewQuota(){return Math.max(0,S.settings.newGrammar-logToday().newG);}

// ---------- sessions ----------
let SESSION=null;
function startVocab(){
  const due=dueIds("v|").filter(id=>S.settings.production||id.endsWith("|r"));
  const fresh=newVocabAvailable();
  const q=[];let fi=0;
  due.forEach((id,i)=>{q.push({id});if(i%3===2&&fi<fresh.length)q.push({id:fresh[fi++],isNew:true});});
  while(fi<fresh.length)q.push({id:fresh[fi++],isNew:true});
  if(!q.length){toast("Nothing due — come back later");return;}
  SESSION={kind:"vocab",queue:q,done:0,total:q.length,ok:0,wrong:[]};nextItem();
}
function startGrammar(forceId){
  const q=shuffle(dueIds("g|")).map(id=>({id}));
  const add=forceId?G[forceId]:(grammarNewQuota()>0?nextGrammarPoint():null);
  if(add&&!S.seenG[add.id]){
    const drills=add.drills.map((_,i)=>({id:"g|"+add.id+"|"+i,isNew:true}));
    q.unshift({lesson:add.id},...drills);
  }else if(forceId){q.unshift({lesson:forceId,review:true});}
  if(!q.length){toast("Nothing due — learn a new point from the Grammar tab");return;}
  SESSION={kind:"grammar",queue:q,done:0,total:q.filter(x=>!x.lesson).length,ok:0,wrong:[],forced:!!forceId};nextItem();
}
function shuffleLabel(kind,lvl){return (kind==="vocab"?"Words":"Grammar")+" · "+(lvl==="all"?"all levels":lvl==="mine"?"my words":LV[lvl]);}
function startShuffle(kind,lvl){
  let ids=[];
  if(kind==="vocab"){
    const pool=allVocab().filter(w=>lvl==="all"||(lvl==="mine"?w[4]===0:w[4]===lvl));
    ids=shuffle(pool.slice()).slice(0,20).map(w=>"v|"+w[0]+"|"+(S.settings.production&&S.cards["v|"+w[0]+"|r"]&&Math.random()<.5?"p":"r"));
  }else{
    // one random drill per grammar point, so a round covers as many different points as possible
    const pts=shuffle(GRAMMAR.filter(g=>lvl==="all"||g.lv===lvl));
    for(let round=0;ids.length<20&&round<4&&pts.length;round++)
      for(const g of pts){if(ids.length>=20)break;const free=g.drills.map((_,i)=>"g|"+g.id+"|"+i).filter(id=>!ids.includes(id));if(free.length)ids.push(free[Math.floor(Math.random()*free.length)]);}
    ids=shuffle(ids);
  }
  if(!ids.length){toast("Nothing to practise here yet");return;}
  SESSION={kind:"shuffle",label:shuffleLabel(kind,lvl),queue:ids.map(id=>({id,shuffle:true})),done:0,total:ids.length,ok:0,wrong:[],again:{kind,lvl}};
  window.scrollTo(0,0);nextItem();
}
function shuffleBtn(kind,lvl,cls,noIcon){return `<button class="btn ${cls||""}" data-shuf="${kind}" data-shuflv="${lvl}">${noIcon?"":"🔀 "}${esc(shuffleLabel(kind,lvl))}</button>`;}
function startLevelPractice(){
  const l=S.settings.level,now=endOfToday();
  const ids=Object.keys(S.cards).filter(id=>levelOf(id)===l&&(S.settings.production||!id.endsWith("|p")));
  if(!ids.length){toast("Learn some "+LV[l]+" words or grammar first");return;}
  ids.sort((a,b)=>{const A=S.cards[a],B=S.cards[b];const da=A.due<=now?0:1,db=B.due<=now?0:1;return da-db||(B.lapses-A.lapses)||(A.ivl-B.ivl);});
  const q=shuffle(ids.slice(0,20)).map(id=>({id}));
  SESSION={kind:"level",queue:q,done:0,total:q.length,ok:0,wrong:[]};nextItem();
}
function nextItem(){
  if(!SESSION)return;
  const it=SESSION.queue.shift();
  if(!it){finish();return;}
  SESSION.cur=it;
  if(it.lesson)return renderLesson(it.lesson,true,it.review);
  const [kind,key,sub]=it.id.split("|");
  if(kind==="v")return sub==="r"?renderRecog(it,key):renderProd(it,key);
  return renderCloze(it,key,+sub);
}
function answer(g,given,expected){
  const it=SESSION.cur,L=logToday();
  if(it.isNew&&!it.counted){it.counted=true;if(it.id.startsWith("v|"))L.newV++;}
  L.rev++;if(g>0){L.ok++;SESSION.ok++;}
  schedule(it.id,g);
  if(g===0){
    SESSION.wrong.push(it.id);
    S.mistakes.push({t:Date.now(),id:it.id,given:given||"",expected:expected||""});
    if(S.mistakes.length>150)S.mistakes=S.mistakes.slice(-150);
    const pos=Math.min(SESSION.queue.length,3+Math.floor(Math.random()*3));
    SESSION.queue.splice(pos,0,{id:it.id,counted:true,retry:true});
  }else{
    if(!it.retry)SESSION.done++;
    // unlock production card once a word is recognised
    if(it.id.endsWith("|r")&&S.settings.production){const p=it.id.slice(0,-1)+"p";if(!S.cards[p])S.cards[p]={ivl:0,ease:2.5,reps:0,lapses:0,due:startOfDay(Date.now())+DAY+4*3600e3};}
  }
  if(g===0&&!it.retry)SESSION.done++;
  save();nextItem();
}
function finish(){
  const s=SESSION;SESSION=null;
  const wrongUniq=[...new Set(s.wrong)];
  view().innerHTML=`<h1>수고했어요!</h1><p class="sub">Session done.</p>
  <div class="stat"><div><b>${s.total}</b><span>items</span></div><div><b>${wrongUniq.length}</b><span>missed</span></div><div><b>${streak()}</b><span>day streak</span></div></div>
  ${wrongUniq.length?`<h2>Worth another look</h2><div class="card"><ul class="list">${wrongUniq.map(id=>`<li><span>${labelFor(id)}</span></li>`).join("")}</ul></div>`:""}
  <div class="row" style="margin-top:18px">${s.again?`<button class="btn seal" id="again">🔀 Another 20</button>`:""}<a class="btn ${s.again?"":"primary"}" href="#today">Back to today</a></div>`;
  if(s.again)$("#again").onclick=()=>startShuffle(s.again.kind,s.again.lvl);
  window.scrollTo(0,0);
}
function labelFor(id){
  const [k,key,sub]=id.split("|");
  if(k==="v"){const w=vocabByKo(key);return `<span class="ko">${esc(key)}</span> <span class="muted">— ${esc(w?w[1]:"")}</span>`;}
  const g=G[key];if(!g)return esc(id);const d=g.drills[+sub];
  return `<span class="ko">${esc(d.q.replace("___",d.a[0]))}</span> <span class="pill n">${esc(g.form)}</span>`;
}
function progressBar(){if(!SESSION)return"";const p=SESSION.total?Math.min(100,SESSION.done/SESSION.total*100):0;
  return `<div class="spread small muted"><span>${SESSION.kind==="vocab"?"Vocabulary":SESSION.kind==="level"?LV[S.settings.level]+" practice":SESSION.kind==="shuffle"?"Shuffle: "+esc(SESSION.label):"Grammar"} · ${Math.min(SESSION.done,SESSION.total)}/${SESSION.total}</span><a href="#today" class="muted" data-quit>End</a></div><div class="progress"><i style="width:${p}%"></i></div>`;}
function gradeButtons(id,correct){
  const labels=[["Again",0],["Hard",1],["Good",2],["Easy",3]];
  const set=correct===false?[labels[0],labels[2]]:correct===true?labels.slice(1):labels;
  const sug=correct===false?0:2;
  return `<div class="grades ${set.length===3?"three":""}" ${set.length===2?'style="grid-template-columns:1fr 1fr"':""}>${set.map(([l,g])=>`<button class="btn ${g===sug?"sug":""}" data-g="${g}">${correct===false&&g===2?"I was right":l}<small>${preview(id,g)}</small></button>`).join("")}</div>`;
}

// ---------- item renderers ----------
function renderRecog(it,ko){
  const w=vocabByKo(ko);if(!w){nextItem();return;}
  view().innerHTML=progressBar()+`<div class="card" style="text-align:center;padding:30px 18px">
    ${it.isNew?'<span class="pill">new word</span>':'<span class="pill n">Korean → English</span>'}
    <div class="big">${esc(w[0])}</div><div>${spkBtn(w[0])}</div>
    <div id="rev" class="hide"><p style="font-size:20px;margin:14px 0 6px">${esc(w[1])}</p>
      ${w[2]?`<div class="ex" style="text-align:left"><div class="ko">${esc(w[2])} ${spkBtn(w[2])}</div><div class="muted small">${esc(w[3]||"")}</div></div>`:""}</div>
  </div>
  <div id="act"><button class="btn primary block" id="show">Show meaning <span class="muted small">(space)</span></button></div>`;
  $("#show").onclick=()=>{$("#rev").classList.remove("hide");$("#act").innerHTML=gradeButtons(it.id,null);if(it.isNew)speak(w[0]);};
}
function renderProd(it,ko){
  const w=vocabByKo(ko);if(!w){nextItem();return;}
  view().innerHTML=progressBar()+`<div class="card">
    <span class="pill n">English → Korean</span>
    <p style="font-size:24px;margin:14px 0 4px;font-weight:500">${esc(w[1])}</p>
    ${w[3]?`<p class="muted small">e.g. “${esc(w[3])}”</p>`:""}
    <form id="f"><input type="text" id="in" class="answer" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="한국어로…" lang="ko"></form>
    <div id="res"></div></div><div id="act"><button class="btn primary block" id="chk">Check</button><button class="btn ghost block" id="idk" style="margin-top:8px">I don't know</button></div>`;
  const check=(given)=>{
    const ok=given!==null&&norm(given)===norm(w[0]);
    $("#in").disabled=true;
    $("#res").innerHTML=`<div class="verdict ${ok?"ok":"no"}">${ok?"맞아요 — correct":"Answer"}</div>

  view().innerHTML=`<h1>기록</h1><p class="sub">${S.updatedAt?"Last practiced "+new Date(S.updatedAt).toLocaleString():"No practice yet."}</p>
  <div class="stat"><div><b>${streak()}</b><span>day streak</span></div><div><b>${learned}</b><span>words started</span></div><div><b>${Object.keys(S.seenG).length}</b><span>grammar points</span></div></div>
  <h2>By level</h2><div class="card" style="padding:6px 18px"><ul class="list">${[1,2,3,4,5,6].map(l=>{const s=levelStats(l);return `<li style="cursor:default"><b style="width:70px">TOPIK ${l}</b><span class="small muted" style="flex:1">${s.wordsStarted}/${s.words} words · ${s.gramSeen}/${s.gram} grammar</span></li>`;}).join("")}</ul></div>
  <div class="card" style="margin-top:14px"><div class="spread small"><b>Last 14 days</b><span class="muted">${tot.rev?Math.round(tot.ok/tot.rev*100):0}% correct overall</span></div>
    <div class="bars">${days.map(([k,v])=>`<div class="${v?"":"zero"}" style="height:${v/max*100}%" title="${k}: ${v}"></div>`).join("")}</div></div>
  ${weak.length?`<h2>Trickiest items</h2><div class="card"><ul class="list">${weak.map(([id,c])=>`<li style="cursor:default"><span>${labelFor(id)}</span><span class="pill">${c.lapses}× missed</span></li>`).join("")}</ul></div>`:""}
  <h2>Settings</h2><div class="card">
    <div class="spread" style="margin-bottom:10px"><span>Level for new words &amp; grammar</span><select id="lvsel" style="width:auto">${[1,2,3,4,5,6].map(n=>`<option value="${n}" ${n===st.level?"selected":""}>TOPIK ${n}</option>`).join("")}</select></div>
    <div class="spread"><span>New words per day</span><select id="nv" style="width:auto">${[0,5,10,15,20,30].map(n=>`<option ${n===st.newVocab?"selected":""}>${n}</option>`).join("")}</select></div>
    <div class="spread" style="margin-top:10px"><span>New grammar points per day</span><select id="ng" style="width:auto">${[0,1,2,3].map(n=>`<option ${n===st.newGrammar?"selected":""}>${n}</option>`).join("")}</select></div>
    <div class="spread" style="margin-top:10px"><span>Also practice English → Korean (typing)</span><input type="checkbox" id="pr" ${st.production?"checked":""} style="width:22px;height:22px"></div>
  </div>
  <h2>Claude feedback</h2><div class="card">
    <p class="small muted" style="margin-top:0">${apiKey()?"API key saved on this device (…"+esc(apiKey().slice(-4))+").":"No API key yet — the Write tab and \"Why was mine wrong?\" need one."}</p>
    <div class="row"><input type="text" id="k2" placeholder="Paste a new key (sk-ant-…)" autocomplete="off" spellcheck="false" style="flex:1"><button class="btn" id="k2s">Save</button>${apiKey()?`<button class="btn ghost" id="k2r">Remove</button>`:""}</div></div>
  <h2>Your data</h2><div class="card">
    <p class="small muted" style="margin-top:0">Progress is saved on this phone only. Back it up now and then — and send the file to Claude when you ask for improvements. You can also paste a backup from the claude.ai version to carry your progress over.</p>
    <div class="row"><button class="btn" id="dl">Download backup</button><button class="btn" id="exp">Copy backup</button><button class="btn" id="imp">Restore backup</button><button class="btn ghost" id="rst">Reset…</button></div>
    <div id="dataout"></div></div>
  <p class="muted small" style="text-align:center;margin-top:24px">Yeonseup v${APP_VERSION}</p>`;
  $("#k2s").onclick=()=>{const v=$("#k2").value.trim();if(!v)return;try{localStorage.setItem(KEY_LS,v);}catch(e){}SAMPLE=true;toast("Key saved");renderStats();};
  if($("#k2r"))$("#k2r").onclick=()=>{try{localStorage.removeItem(KEY_LS);}catch(e){}SAMPLE=null;toast("Key removed");renderStats();};
  $("#dl").onclick=()=>{const blob=new Blob([JSON.stringify(S)],{type:"application/json"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="yeonseup-backup-"+dayKey()+".json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);};
  $("#nv").onchange=e=>{st.newVocab=+e.target.value;save();};
  $("#lvsel").onchange=e=>{st.level=+e.target.value;save();};
  $("#ng").onchange=e=>{st.newGrammar=+e.target.value;save();};
  $("#pr").onchange=e=>{st.production=e.target.checked;save();};
  $("#exp").onclick=async()=>{const txt=JSON.stringify(S);try{await navigator.clipboard.writeText(txt);toast("Backup copied");}catch(e){$("#dataout").innerHTML=`<textarea rows="4" style="margin-top:10px" readonly>${esc(txt)}</textarea>`;$("#dataout textarea").select();}};
  $("#imp").onclick=()=>{$("#dataout").innerHTML=`<p class="small" style="margin:12px 0 6px">Choose a backup file, or paste the backup text:</p><input type="file" id="impf" accept=".json,application/json"><textarea id="impt" rows="4" style="margin-top:10px" placeholder="…or paste a backup here"></textarea><button class="btn primary" id="impgo" style="margin-top:8px">Restore</button>`;
    const restore=txt=>confirmBox("Replace the progress on this phone with the backup?","Restore",()=>{try{const x=JSON.parse(txt);if(!x.cards)throw 0;S=hydrate(x);save();toast("Restored");renderStats();}catch(e){toast("That doesn't look like a backup");}});
    $("#impf").onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(restore);};
    $("#impgo").onclick=()=>{const t=$("#impt").value.trim();if(t)restore(t);};};
  $("#rst").onclick=()=>confirmBox("Erase all progress? This can't be undone.","Erase",()=>{S=defaultState();save();toast("Progress reset");renderStats();});
}
function confirmBox(msg,label,fn){const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card"><p>${esc(msg)}</p><div class="row"><button class="btn seal" id="cy">${esc(label)}</button><button class="btn" id="cn">Cancel</button></div></div>`;document.body.appendChild(m);m.querySelector("#cy").onclick=()=>{m.remove();fn();};m.querySelector("#cn").onclick=()=>m.remove();}

// ---------- routing & events ----------
function route(){
  const t=(location.hash||"#today").slice(1);
  const tab=["today","grammar","write","words","stats"].includes(t)?t:"today";
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.t===tab));
  SESSION=null;
  ({today:renderToday,grammar:renderGrammarList,write:renderWrite,words:renderWords,stats:renderStats})[tab]();
}
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{
  const say=e.target.closest("[data-say]");if(say){e.preventDefault();speak(say.dataset.say);return;}
  const g=e.target.closest("[data-g]");if(g&&SESSION){const a=$("#act");answer(+g.dataset.g,a&&a.dataset.given,a&&a.dataset.exp);return;}
  const sh=e.target.closest("[data-shuf]");if(sh){const v=sh.dataset.shuflv;startShuffle(sh.dataset.shuf,v==="all"||v==="mine"?v:+v);return;}
  const op=e.target.closest("[data-open]");if(op){renderLesson(op.dataset.open,false);return;}
  const wg=e.target.closest("[data-wg]");if(wg){writeTarget=wg.dataset.wg;if(location.hash==="#write"){e.preventDefault();route();}return;}
  const li=e.target.closest("[data-say-li]");if(li){speak(li.dataset.sayLi);return;}
  const q=e.target.closest("[data-quit]");if(q&&SESSION){e.preventDefault();SESSION=null;location.hash="#today";route();}
});
document.addEventListener("keydown",e=>{
  if(!SESSION)return;
  const tag=(e.target.tagName||"").toLowerCase();
  if(e.key===" "&&tag!=="input"&&tag!=="textarea"&&$("#show")){e.preventDefault();$("#show").click();return;}
  if(e.key==="Enter"&&tag!=="input"&&tag!=="textarea"){const s=$(".grades .sug");if(s){e.preventDefault();s.click();}else if($("#go")){e.preventDefault();$("#go").click();}}
  if(tag!=="input"&&tag!=="textarea"&&["1","2","3","4"].includes(e.key)){const bs=document.querySelectorAll(".grades .btn");const b=bs[+e.key-1];if(b){e.preventDefault();b.click();}}
});
route();
// offline support
if("serviceWorker" in navigator&&(location.protocol==="https:"||location.hostname==="localhost")){
  navigator.serviceWorker.register("sw.js").then(reg=>{
    reg.addEventListener("updatefound",()=>{const w=reg.installing;w&&w.addEventListener("statechange",()=>{if(w.state==="installed"&&navigator.serviceWorker.controller)toast("Updated — reopen the app to get the new version");});});
  }).catch(()=>{});
}
</script>
